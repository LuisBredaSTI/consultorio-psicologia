<!doctype html>
<html lang="pt-BR">
<head>
<link rel="icon" href="/consultorio.ico" type="image/x-icon">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consultório • Agenda</title>
<style>:root{--bg:#f5f6fa;--card:#fff;--line:#e3e6ec;--text:#20242c;--muted:#6b7280;--accent:#5749ad;--green:#e4f3e7;--blue:#e8f1ff;--yellow:#fff4d2;--red:#ffe5e5;--gray:#eef0f3}
*{box-sizing:border-box}body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;background:var(--bg);color:var(--text);font-size:13px}
.layout{display:flex;min-height:100vh}
section.hidden{display:none}select,input,textarea{font:inherit}input,select,textarea{border:1px solid #d1d5db;border-radius:7px;padding:7px 9px;background:#fff}button{cursor:pointer}.primary{background:#262332;color:#fff;border:0;border-radius:7px;padding:8px 11px}.secondary{background:#fff;border:1px solid #d1d5db;border-radius:7px;padding:8px 11px}.danger{color:#a33;border-color:#e5baba}.muted{color:var(--muted)}
.note{font-size:9px;line-height:14px;color:#6d7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history{margin-top:8px}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:7px 8px;border-bottom:1px solid #eee;text-align:left;font-size:12px}th{background:#fafafa}
.actions{white-space:nowrap}.actions button{margin-right:4px}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:30}.modal{background:#fff;border-radius:12px;width:min(760px,94vw);max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal h2{margin:0 0 12px;font-size:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formgrid .full{grid-column:1/-1}.modal label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:#555}.modalfooter{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.hidden{display:none!important}.toast{position:fixed;right:15px;bottom:15px;background:#222;color:#fff;padding:10px 12px;border-radius:7px;z-index:50;display:none}.small{font-size:11px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checklist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.checklist label{display:flex;gap:5px;align-items:center;font-size:11px}
.repeat-check{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start;gap:8px!important}.repeat-check input{margin:0;flex:0 0 auto}
.wa-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
/* V22 - cabeçalhos e menu fixos */
.layout{position:relative}
.patient-attachments-list{display:flex;flex-direction:column;gap:5px;max-height:150px;overflow:auto}.patient-attachment-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;background:#fafafa;border:1px solid var(--line);border-radius:7px;font-size:11px}.patient-attachment-row .meta{color:#777}.patient-attachment-row a{color:#3159a6;text-decoration:none}.patient-attachment-row button{padding:3px 6px;font-size:10px}
.brand{padding:6px 11px 12px;line-height:1.2;text-align:left}.brand strong{display:block;font-size:17px}.brand small{display:block;font-size:11px;color:var(--muted);margin-top:2px}

.hist-table{width:100%;border-collapse:collapse;table-layout:fixed}.hist-table thead th{position:sticky;top:0;z-index:2;background:#fafafa;box-shadow:0 1px 0 var(--line);font-size:14px;text-align:left;padding:9px 10px}
.hist-table td{padding:3px 6px;border-bottom:1px solid #f0f1f4}.hist-table th:nth-child(1),.hist-table td:nth-child(1){width:128px}.hist-table th:nth-child(2),.hist-table td:nth-child(2){width:112px}
.hist-in{width:100%;box-sizing:border-box;padding:7px 9px;font-size:15px;font-family:inherit;border:1px solid transparent;border-radius:6px;background:transparent}.hist-in:hover,.hist-in:focus{border-color:#cfd3dc;background:#fff;outline:none}.hist-in.val{text-align:right}.hist-in:disabled{color:#9aa0ab}
.hist-table tr.session-paid td{background:#dff3e3}.hist-table tr.session-due td{background:#fff1c2}
/* ===== Novo visual: menu lateral e tela de Pacientes ===== */
:root{--nav-w:224px;--brand:#5b4bc4;--brand-soft:#efecfd;--ok:#1f8a4c;--ok-soft:#e3f5ea;--warn:#a15c00;--warn-soft:#fff1c9;--bad:#b3261e;--bad-soft:#fde8e6}
@media(max-width:1500px){:root{--nav-w:72px}}
nav{position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;z-index:9;overflow-y:auto;flex:none}
nav .brand{display:flex;align-items:center;gap:10px;padding:0 6px 16px}nav .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7a6be0,#5b4bc4);color:#fff;display:grid;place-items:center;flex:none}
nav .logo svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}nav .brand-text strong{display:block;font-size:17px}nav .brand-text small{font-size:11px;color:var(--muted)}
nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;margin:0;border:0;background:transparent;border-radius:10px;font:inherit;font-size:15px;font-weight:500;color:#4b5263;text-align:left;cursor:pointer}
nav button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{background:#f3f4f8}nav button.active{background:var(--brand-soft);color:var(--brand);font-weight:650}
nav .zoomctl{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:10px 4px 0;border-top:1px solid var(--line)}nav .zoomctl button{width:32px;height:32px;padding:0;margin:0;justify-content:center;font-size:17px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:8px}nav .zoomctl button:hover{background:#f3f4f8}nav .zoomctl span{font-size:12.5px;font-weight:650;color:var(--muted);cursor:pointer;text-align:center;flex:1}
@media(max-width:1500px){nav .zoomctl{flex-direction:column-reverse;padding-top:8px}nav .zoomctl button{width:40px}nav .brand-text,nav button span{display:none}nav button{justify-content:center;padding:12px 0}nav .brand{justify-content:center;padding:0 0 16px}}
main{flex:1;min-width:0;margin-left:var(--nav-w);padding:14px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap}.chip.g{background:var(--ok-soft);color:var(--ok)}.chip.a{background:var(--warn-soft);color:var(--warn)}.chip.n{background:#eef0f4;color:#5b6272}.chip.r{background:var(--bad-soft);color:var(--bad)}.chip.b{background:#e8f0ff;color:#2f5fd0}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--brand);background:var(--brand-soft);flex:none}.avatar.lg{width:48px;height:48px;font-size:17px}
#pacientes{font-size:15px;height:var(--page-h,calc(100vh - 28px))}
.pt{display:grid;grid-template-columns:clamp(250px,calc(var(--page-w,1100px)*.25),340px) minmax(0,1fr);height:100%;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pt-list{border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;padding:16px 14px;min-height:0}
.pt-list-head{display:flex;justify-content:space-between;align-items:center}.pt-list-head h1{font-size:22px;margin:0}.pt-sub{font-size:13px;color:var(--muted)}
.pt-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;color:var(--muted)}.pt-search input{border:0;outline:0;padding:9px 0;flex:1;font-size:15px;background:transparent;min-width:0}
.seg{display:inline-flex;background:#eceef4;border-radius:10px;padding:3px;gap:2px;align-self:flex-start}.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font:inherit;font-weight:600;color:#5b6272;font-size:14px;margin:0;width:auto;cursor:pointer}.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pt-opt{font-size:13px;color:#4b5263;display:flex;align-items:center;gap:8px}
.pt-items{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -6px;padding:0 6px}
.pt-item{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:10px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;font:inherit;color:inherit;margin:0}
.pt-item:hover{background:#f6f7fb}.pt-item.on{background:var(--brand-soft)}.pt-item.on .nm{color:var(--brand)}.pt-item.off .nm{color:#8a90a0}
.pt-item .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-detail{display:flex;flex-direction:column;min-height:0;padding:16px 20px;gap:12px;overflow:auto;background:#fafbfd}
.pt-empty{margin:auto;color:var(--muted)}
.pt-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pt-head .who{display:flex;align-items:center;gap:14px;min-width:0}.pt-head h2{margin:0;font-size:24px;line-height:1.2}.pt-sub2{color:var(--muted);font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pt-actions{display:flex;gap:8px;align-items:center}.pt-actions button,.pt-actions summary{margin:0;width:auto;font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pt-actions .primary{background:var(--brand);border:1px solid var(--brand);color:#fff}.pt-actions .secondary,.pt-actions summary{background:#fff;border:1px solid var(--line);color:var(--text)}
details.menu{position:relative}details.menu summary{list-style:none;padding:9px 12px}details.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,20,60,.15);padding:6px;min-width:250px;display:flex;flex-direction:column}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;font:inherit;font-size:14px;margin:0;cursor:pointer;color:var(--text)}.menu-pop button:hover{background:#f3f4f8}.menu-pop button.danger{color:var(--bad)}
.pt-stats{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:stretch}
.pt-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 16px}.pt-stat span{display:block;font-size:13px;color:var(--muted)}.pt-stat b{font-size:22px}.pt-stat.warn{border-color:#f0d58a}.pt-stat.warn b{color:var(--warn)}.pt-stat.ok b{color:var(--ok)}
.pt-from{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;justify-content:center;gap:3px}.pt-from input{padding:6px 8px;font-size:14px}
.pt-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.pt-card-head{display:flex;align-items:center;gap:12px;cursor:pointer}.pt-card-head h3{margin:0;font-size:16px}.pt-card-head .muted{flex:1;font-size:13.5px}.pt-card-head .chev{color:var(--muted)}
.pt-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-top:12px}.pt-form label{font-size:12.5px;color:var(--muted);display:block}.pt-form label.wide{grid-column:span 2}
.pt-form input,.pt-form select{width:100%;margin-top:4px;padding:9px 10px;font-size:15px;border:1px solid var(--line);border-radius:9px;background:#fcfcfe;color:var(--text)}
.pt-cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;flex:1;min-height:280px}
.pt-cols .pt-card{display:flex;flex-direction:column;min-height:0;padding:12px 0 0}.pt-cols h3{margin:0 16px 8px;font-size:16px}.pt-scroll{overflow:auto;min-height:0;flex:1}
details.att summary{cursor:pointer;font-weight:650;font-size:15px}
@media(max-width:1180px){.pt{grid-template-columns:230px minmax(0,1fr)}.pt-stats{grid-template-columns:repeat(3,1fr)}.pt-from{grid-column:1/-1;flex-direction:row;align-items:center}}
@media(max-width:1000px){.pt-cols{grid-template-columns:1fr}}
/* ===== Agenda (novo visual) ===== */
#inicio{font-size:14px}
.ag{display:flex;gap:14px;height:var(--page-h,calc(100vh - 28px))}.ag-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ag-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}.ag-top h1{font-size:22px;margin:0}
.nav3{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.nav3 button{border:0;background:transparent;padding:7px 13px;font:inherit;font-weight:600;font-size:13.5px;border-right:1px solid var(--line);cursor:pointer;margin:0;width:auto;display:inline-flex;align-items:center}.nav3 button:last-child{border:0}.nav3 button:hover{background:#f6f7fb}
.weektitle{font-weight:700;font-size:15px}.weektitle .y{color:var(--muted);font-weight:500;margin-left:6px}
.tb{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;font-size:13.5px;margin:0;width:auto;cursor:pointer;white-space:nowrap}.tb:hover{background:#f6f7fb}
.ag-chips{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;min-height:28px}.ag-chips .chip{font-size:13px;padding:3px 11px}.ag-chips .chip.r{background:var(--bad-soft);color:var(--bad)}.ag-chips .chip.b{background:#e8f0ff;color:#2f5fd0}.ag-chips .chip.p{background:#fff;border:1px solid var(--line);color:var(--text)}
.ag-chips button.chip{border:0;cursor:pointer;font-family:inherit}
.ag-scroll{flex:1;min-height:0;overflow:auto}
.calendar{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.calhead,.calbody{display:grid;grid-template-columns:var(--time-col,58px) repeat(var(--ncols,5),minmax(0,1fr))}
.dh{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);background:#fcfcfe;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}.dh.corner{border-left:0;cursor:default}
.dh b{display:block;font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}.dh .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:17px;font-weight:700}
.dh.today .n{background:var(--brand);color:#fff}.dh.today b{color:var(--brand)}.dh.sel:not(.today) .n{background:var(--brand-soft);color:var(--brand)}.dh small{font-size:11px;color:var(--muted)}.dh.daylock{background:repeating-linear-gradient(135deg,#f6f6f9,#f6f6f9 6px,#eceef3 6px,#eceef3 12px)}
.tm{min-height:var(--row-height,60px);font-size:12px;color:var(--muted);text-align:right;padding:6px 8px 0 0;border-bottom:1px solid #f0f1f5}
.sl{min-height:var(--row-height,60px);border-left:1px solid var(--line);border-bottom:1px solid #f0f1f5;padding:3px;display:flex;flex-direction:column;gap:3px;position:relative}.sl.today{background:#fbfaff}
.sl.empty{cursor:pointer}.sl.empty:after{content:'+';position:absolute;right:6px;bottom:4px;width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700;display:grid;place-items:center;opacity:0;transition:opacity .12s}.sl.empty:hover:after{opacity:1}.sl.empty:hover{background:#faf9ff}
.cd{display:flex;align-items:center;gap:6px;min-height:36px;padding:5px 8px;border-radius:8px;background:#fff;border:1px solid var(--line);border-left:4px solid #a6a9b1;box-shadow:0 1px 2px rgba(20,20,60,.05);cursor:pointer;min-width:0}.cd[draggable=true]{cursor:grab}
.cd .nm{flex:1;min-width:0;font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cd .tmx{color:var(--muted);font-size:12px;font-weight:600}
.cd .nt{color:var(--muted);display:flex}.cd .nt svg{width:15px;height:15px}
.cd .st{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#eef0f4;color:#5b6272;white-space:nowrap}
.cd.ok{border-left-color:var(--ok);background:#f4fbf6}.cd.ok .st{background:var(--ok-soft);color:var(--ok)}
.cd.bad{border-left-color:var(--bad);background:#fff7f6}.cd.bad .st{background:var(--bad-soft);color:var(--bad)}
.cd.pend{border-left-color:var(--warn)}.cd.pend .st{background:var(--warn-soft);color:var(--warn)}
.gh{display:flex;align-items:center;gap:6px;min-height:24px;padding:2px 8px;border-radius:7px;border:1px dashed #c3cbe3;border-left:4px solid #5b84e0;background:#f6f9ff;color:#6b7280;font-size:12.5px;cursor:pointer;text-decoration:line-through;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gh.mine{border-left-color:#8f7ae0;background:#f8f5ff;border-color:#d1c7f0}
.ev{display:flex;align-items:center;gap:7px;min-height:34px;padding:5px 8px;border-radius:8px;background:#f3effc;border:1px dashed #b9aee8;color:#5a4aa6;font-weight:600;font-size:13px;cursor:pointer}.ev .dot{width:8px;height:8px;border-radius:50%;background:#8f7ae0;flex:none}.ev b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk{display:flex;align-items:center;gap:7px;min-height:34px;padding:0 10px;border-radius:8px;background:repeating-linear-gradient(135deg,#f1f2f6,#f1f2f6 6px,#e8eaf0 6px,#e8eaf0 12px);color:#6b7280;font-size:12.5px;font-weight:600;cursor:pointer}
.ag-legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:8px 2px 4px;align-items:center;flex-wrap:wrap}.ag-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.history{margin-top:8px}.history details{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}.history table{margin-top:6px}
.ag-panel{width:clamp(280px,calc(var(--page-w,1100px)*.24),340px);flex:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto}.ag-panel h2{margin:0;font-size:18px}.ag-panel .sub{color:var(--muted);font-size:13px}
.warnbox{background:var(--warn-soft);color:var(--warn);border:0;border-radius:10px;padding:9px 12px;font:inherit;font-weight:650;font-size:13px;text-align:left;cursor:pointer;width:100%;margin:0}
.pi{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}.pi .h{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}.pi .h b{font-size:15px}.pi .tmx{font-size:12.5px;color:var(--muted);font-weight:600}
.pi.done{background:#f8f9fb}.pi.done.ok{background:#f4fbf6;border-color:#cfe9d8}.pi.done.bad{background:#fff7f6;border-color:#f3c5c0}
.pi.ev2{background:#f3effc;border:1px dashed #b9aee8;color:#5a4aa6;font-weight:600;padding:8px 12px;flex-direction:row;justify-content:space-between}
.acts{display:flex;gap:6px}.acts button{flex:1;text-align:center;padding:7px 4px;border-radius:8px;font:inherit;font-weight:650;font-size:12.5px;border:1px solid var(--line);background:#fff;cursor:pointer;margin:0;width:auto;white-space:nowrap}
.acts .y{background:var(--ok-soft);color:var(--ok);border-color:#bfe3cc}.acts .f{background:var(--bad-soft);color:var(--bad);border-color:#f3c5c0}.acts .d{background:#e8f0ff;color:#2f5fd0;border-color:#c5d5f7}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-weight:650;font-size:13.5px;cursor:pointer;margin:0;width:auto}.pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pend-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}.pend-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}.pend-row .acts{flex:none}
@media(max-width:1100px){.ag{flex-direction:column;height:auto}.ag-panel{width:auto}}
.tb.p{background:var(--brand);border-color:var(--brand);color:#fff}.tb.p:hover{background:#4d3eb3}
/* ===== Financeiro (novo visual) ===== */
#financeiro{font-size:14px}.fin{display:flex;flex-direction:column;gap:12px}
.fin-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.fin-top h1{font-size:22px;margin:0}.fin-month{padding:7px 14px;font-weight:700;font-size:14px;min-width:160px;text-align:center;border-right:1px solid var(--line)}
.fin-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.fin-k{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;position:relative;overflow:hidden;text-align:left;font:inherit;color:inherit;cursor:pointer;margin:0;width:auto;display:block}.fin-k:hover{border-color:#cfd3dc}.fin-k.on{box-shadow:0 0 0 2px var(--brand)}
.fin-k .bar{position:absolute;left:0;top:0;bottom:0;width:4px}.fin-k.warn .bar{background:#e0a21a}.fin-k.bad .bar{background:var(--bad)}.fin-k.ok .bar{background:var(--ok)}.fin-k.pur .bar{background:#7a6be0}
.fin-k .l{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600}.fin-k .v{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}.fin-k .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.fin-k.warn .v{color:var(--warn)}.fin-k.bad .v{color:var(--bad)}.fin-k.ok .v{color:var(--ok)}
.fin-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.fin-chips button.chip{border:0;cursor:pointer;font-family:inherit}.fin-chips .chip.w{background:#fff;border:1px solid var(--line);color:var(--text)}.fin-chips .hint{margin-left:auto;font-size:12.5px;color:var(--muted)}
.fin-row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
.fin-card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}.fin-card-h h3{margin:0;font-size:16px}
.fin-legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);align-items:center}.fin-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.fin-chart svg{width:100%;height:auto;display:block}.fin-chart .grp{cursor:pointer}.fin-chart .grp:hover rect.hl{fill:#f3f1fd}
.fin-foot{font-size:12.5px;color:var(--muted);margin-top:6px}
.fin-table{width:100%;border-collapse:collapse}.fin-table th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line)}.fin-table td{padding:7px 8px;border-bottom:1px solid #f0f1f5;vertical-align:middle}.fin-table .num{text-align:right;font-variant-numeric:tabular-nums}.fin-table tr:last-child td{border-bottom:0}
.fin-table .who{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:650;border:0;background:transparent;font:inherit;padding:0;margin:0;width:auto;color:inherit;text-align:left}.fin-table .who:hover{color:var(--brand)}.fin-table .avatar{width:28px;height:28px;font-size:11px}
.fin-act{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}.fin-act button{padding:4px 9px;font:inherit;font-size:12.5px;font-weight:600;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;margin:0;width:auto;display:inline-flex;align-items:center;gap:5px}.fin-act button:hover{background:#f6f7fb}
.fin-tabs{display:inline-flex;background:#eceef4;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}.fin-tabs button{border:0;background:transparent;padding:5px 12px;border-radius:8px;font:inherit;font-weight:600;color:#5b6272;font-size:13px;margin:0;width:auto;cursor:pointer}.fin-tabs button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media(max-width:1100px){.fin-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.fin-row{grid-template-columns:1fr}}
</style>

<body>
<div class="layout">
<nav><div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div class="brand-text"><strong>Consultório</strong><small id="appVersion"></small></div></div>

<button onclick="show('financeiro',this)" title="Financeiro"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 6v2m0 8v2"/></svg><span>Financeiro</span></button>
<div class="zoomctl"><button onclick="uiScale(-1)" title="Diminuir esta tela">−</button><span id="zoomVal" onclick="uiScaleReset()" title="Tamanho desta tela. Clique para voltar ao padrão">100%</span><button onclick="uiScale(1)" title="Aumentar esta tela">+</button></div>

<main>
<section id="inicio">
<div class="ag">
<div class="ag-main">
<div class="ag-top"><h1>Agenda</h1><div class="nav3"><button onclick="changeWeek(-1)" title="Semana anterior"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button onclick="goToday()">Hoje</button><button onclick="changeWeek(1)" title="Próxima semana"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div><div class="weektitle" id="weekTitle"></div><span style="flex:1"></span><button class="tb" onclick="openLockDay()"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Travar período</button><button class="tb" onclick="openPopulateAgenda()"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Preencher agenda</button><button class="tb" onclick="openAgendaSettings()"><svg class="i" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg> Ajustar</button></div>
<div class="ag-chips" id="agChips"></div>
<div class="ag-scroll"><div class="calendar"><div id="calHead" class="calhead"></div><div id="calBody" class="calbody"></div></div>
<div class="ag-legend"><span><i style="background:#a6a9b1"></i>Agendada</span><span><i style="background:var(--ok)"></i>Realizada</span><span><i style="background:var(--bad)"></i>Faltou</span><span><i style="background:#5b84e0"></i>Desmarcou / Desmarquei</span><span><i style="background:var(--warn)"></i>Já passou, sem status</span><span style="margin-left:auto">Sáb e Dom aparecem quando têm sessões</span></div>

</div>

</div>

<div class="pt">
<aside class="pt-list">
<div class="pt-list-head"><h1>Pacientes</h1><button class="primary" onclick="openPatientModal()">＋ Novo</button></div>
<div class="pt-sub" id="ptSub"></div>
<div class="pt-search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="ptSearch" placeholder="Buscar por nome ou telefone…" oninput="PT.q=this.value;renderPatientList()"></div>
<div class="seg" id="ptSeg"><button class="on" data-v="ativos" onclick="ptSetStatus('ativos')">Ativos</button><button data-v="inativos" onclick="ptSetStatus('inativos')">Inativos</button><button data-v="todos" onclick="ptSetStatus('todos')">Todos</button></div>
<label class="pt-opt"><input type="checkbox" onchange="PT.onlyDue=this.checked;renderPatientList()"> só com saldo a receber</label>

<script>
fetch('/api/health').then(r=>r.json()).then(h=>{const e=document.getElementById('appVersion');if(e&&h.version)e.textContent='V'+h.version}).catch(()=>{});
const $=id=>document.getElementById(id); const money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const STATUS=[['Agendada','agendada'],['Realizada','realizada'],['Desmarcou','ca'],['Desmarquei','ca'],['Faltou','faltou']];
// Desmarcou (paciente) e Desmarquei (profissional): liberam o horário e não geram cobrança
const FREES_SLOT=['Desmarcou','Desmarquei'];
const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']; const MONTHS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const TIMES=[]; for(let h=7;h<=20;h++) TIMES.push(String(h).padStart(2,'0')+':00');
let weekStart=monday(new Date()),agendaData={sessoes:[],locks:[],eventos:[]};
function pad(n){return String(n).padStart(2,'0')} function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())} function dmy(v){if(!v)return '—';const p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(v)} function monday(d){let x=new Date(d);x.setHours(12,0,0,0);let day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x} function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function show(id,btn){document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');if(id==='inicio'){loadAgenda()}if(id==='pacientes')loadPatients();if(id==='financeiro')loadFinance();applyScale()}
/* ===== Tamanho da tela (lembrado separadamente para cada tela) ===== */
const SCALE_DEFAULT={inicio:.85,pacientes:1,financeiro:1};
function scaleMap(){try{return JSON.parse(localStorage.getItem('uiScale')||'{}')}catch(e){return {}}}
function saveScale(m){try{localStorage.setItem('uiScale',JSON.stringify(m))}catch(e){}}
function currentSection(){const s=document.querySelector('main>section:not(.hidden)');return s?s.id:'inicio'}
function getScale(id){const v=Number(scaleMap()[id]);return v>=.5&&v<=1.3?v:(SCALE_DEFAULT[id]||1)}
// O zoom é aplicado só na tela aberta; as medidas que dependem da janela (altura/largura úteis) são compensadas.
function applyScale(){const id=currentSection(),sec=$(id),z=getScale(id);sec.style.zoom=z;
  sec.style.setProperty('--page-h',((window.innerHeight-28)/z)+'px');sec.style.setProperty('--page-w',((window.innerWidth-document.querySelector('nav').offsetWidth-28)/z)+'px');
  $('zoomVal').textContent=Math.round(z*100)+'%'}
function uiScale(step){const id=currentSection(),m=scaleMap();m[id]=Math.min(1.3,Math.max(.5,Math.round((getScale(id)+step*.05)*100)/100));saveScale(m);applyScale()}
function uiScaleReset(){const id=currentSection(),m=scaleMap();delete m[id];saveScale(m);applyScale()}
window.addEventListener('resize',applyScale);
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)} function changeWeek(n){weekStart=addDays(weekStart,n*7);loadAgenda()} function goToday(){weekStart=monday(new Date());loadAgenda()}

/* Caixas de diálogo próprias (substituem confirm/prompt do navegador) */
let _dlg=null;
function dialogBox(title,body,buttons){return new Promise(res=>{_dlg={res,buttons};$('dlgRoot').innerHTML=`<div class="modalback" style="z-index:3000" onclick="if(event.target===this)dlgClick(-1)"><div class="modal" style="width:min(440px,94vw)"><h2>${esc(title)}</h2>${body}<div class="modalfooter">${buttons.map((b,i)=>`<button class="${b.cls||'secondary'}" onclick="dlgClick(${i})">${esc(b.label)}</button>`).join('')}</div></div></div>`;const inp=$('dlgInput');if(inp){inp.focus();try{inp.select()}catch(e){}}document.querySelectorAll('#dlgRoot input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')dlgClick(buttons.findIndex(b=>b.input||b.collect))})})}
function dlgClick(i){if(!_dlg)return;const {res,buttons}=_dlg;_dlg=null;const b=buttons[i],inp=$('dlgInput');const val=b?(b.collect?b.collect():b.input?(inp?inp.value:''):b.value):null;$('dlgRoot').innerHTML='';res(val)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&_dlg)dlgClick(-1)});
function confirmBox(msg,o={}){return dialogBox(o.title||'Confirmar',`<p>${esc(msg)}</p>`,[{label:o.cancelText||'Cancelar',value:false},{label:o.okText||'Confirmar',value:true,cls:o.danger?'secondary danger':'primary'}]).then(v=>!!v)}
function promptBox(title,label,o={}){return dialogBox(title,`<label style="display:block;font-size:12px;color:#555">${esc(label)}<input id="dlgInput" type="${o.type||'text'}" value="${esc(o.value||'')}" placeholder="${esc(o.placeholder||'')}" style="display:block;width:100%;margin-top:6px;box-sizing:border-box"></label>`,[{label:'Cancelar',value:null},{label:o.okText||'OK',input:true,cls:'primary'}])}
function choiceBox(title,msg,buttons){return dialogBox(title,`<p>${esc(msg)}</p>`,buttons)}

function lockFor(date,time){return agendaData.locks.find(l=>l.lock_date===date && (l.start_time===null||l.start_time===time))} function slotSessions(date,time){return agendaData.sessoes.filter(s=>s.session_date===date&&s.session_time&&s.session_time.slice(0,2)===time.slice(0,2)&&!Number(s.slot_removed))} function sessionFor(date,time){return slotSessions(date,time).find(s=>!FREES_SLOT.includes(s.status))} function cancelledGhosts(date,time){return slotSessions(date,time).filter(s=>FREES_SLOT.includes(s.status))} function eventsFor(date,time){return (agendaData.eventos||[]).filter(e=>e.event_date===date&&e.event_time.slice(0,2)===time.slice(0,2))}
/* ===== Agenda ===== */
let agDay=null,agPending={total:0,itens:[]};
const todayIso=()=>iso(new Date());
const WEEKDAYS_LONG=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const NOTE_ICON='<svg class="i" viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z"/></svg>';
async function loadAgenda(){const start=iso(weekStart),end=iso(addDays(weekStart,6));
  const [d,pend]=await Promise.all([fetch(`/api/agenda?start=${start}&end=${end}`).then(r=>r.json()),fetch('/api/agenda/pendentes').then(r=>r.json()).catch(()=>({total:0,itens:[]}))]);
  agendaData=d;agPending=pend;
  const a=weekStart,b=addDays(weekStart,6),mo=x=>MONTHS[x.getMonth()];
  $('weekTitle').innerHTML=(a.getMonth()===b.getMonth()?`${a.getDate()} – ${b.getDate()} de ${mo(a)}`:`${a.getDate()} de ${mo(a).slice(0,3)} – ${b.getDate()} de ${mo(b).slice(0,3)}`)+`<span class="y">${b.getFullYear()}</span>`;
  if(!agDay||agDay<start||agDay>end){const t=todayIso();agDay=(t>=start&&t<=end)?t:start}
  renderCalendar();renderChips();renderDayPanel();renderHistory()}
function getAgendaSettings(){try{return JSON.parse(localStorage.getItem('agendaSettings')||'{}')}catch{return {}}}
const defaultAgendaSettings={version:3,hiddenDays:[5,6],hiddenTimes:[],rowHeight:60,timeCol:58};
function agendaSettings(){
  const raw=getAgendaSettings();
  if(Number(raw.version||0)<3)return {...defaultAgendaSettings,hiddenTimes:raw.hiddenTimes||[],rowHeight:Number(raw.rowHeight)||defaultAgendaSettings.rowHeight}; // migra: mantém horários e altura, volta ao padrão de dias
  return {...defaultAgendaSettings,...raw};
}
function applyAgendaCss(){const a=agendaSettings();document.documentElement.style.setProperty('--row-height',a.rowHeight+'px');document.documentElement.style.setProperty('--time-col',a.timeCol+'px')}
function visibleTimes(){const a=agendaSettings();return TIMES.filter(t=>!a.hiddenTimes.includes(t))}
// Dias ocultos nas preferências (padrão: sábado e domingo) aparecem sozinhos quando têm sessão, compromisso ou trava.
function visibleDayOffsets(){const a=agendaSettings();return [0,1,2,3,4,5,6].filter(i=>{if(!a.hiddenDays.includes(i))return true;const ds=iso(addDays(weekStart,i));
  return agendaData.sessoes.some(s=>s.session_date===ds&&!Number(s.slot_removed))||agendaData.eventos.some(e=>e.event_date===ds)||agendaData.locks.some(l=>l.lock_date===ds)})}
function renderCalendar(){
  applyAgendaCss();
  const offsets=visibleDayOffsets(),tod=todayIso();
  $('calHead').style.setProperty('--ncols',offsets.length);$('calBody').style.setProperty('--ncols',offsets.length);
  let hd='<div class="dh corner"></div>';
  for(const o of offsets){const d=addDays(weekStart,o),ds=iso(d),dl=agendaData.locks.find(l=>l.lock_date===ds&&l.start_time===null);
    hd+=`<div class="dh ${ds===tod?'today':''} ${ds===agDay?'sel':''} ${dl?'daylock':''}" onclick="selectAgDay('${ds}')" title="${dl?'Dia travado: '+esc(dl.reason):'Ver este dia no painel ao lado'}"><b>${DAYS[d.getDay()]}</b><span class="n">${d.getDate()}</span>${dl?`<small>🔒 ${esc(dl.reason)}</small>`:''}</div>`}
  $('calHead').innerHTML=hd;
  let b='';
  for(const t of visibleTimes()){
    b+=`<div class="tm">${t}</div>`;
    for(const o of offsets){
      const d=addDays(weekStart,o),ds=iso(d),lock=lockFor(ds,t),s=sessionFor(ds,t),ghosts=cancelledGhosts(ds,t),evs=eventsFor(ds,t);
      b+=`<div class="sl ${ds===tod?'today':''} ${!s&&!lock&&!evs.length?'empty':''}" ondragover="allowDrop(event)" ondrop="dropSlot(event,'${ds}','${t}')" onclick="emptySlotClick(event,'${ds}','${t}')" oncontextmenu="slotContextMenu(event,'${ds}','${t}');return false;">${lock?`<div class="lk" onclick="unlock(event,${lock.id})" title="Clique para destravar"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>${esc(lock.reason)}</div>`:ghosts.map(cancelledGhostHtml).join('')+(s?appointment(s):'')+evs.map(personalEvent).join('')}</div>`;
    }
  }
  $('calBody').innerHTML=b;
}
function selectAgDay(ds){agDay=ds;renderCalendar();renderDayPanel()}
function renderChips(){
  const live=agendaData.sessoes.filter(s=>!Number(s.slot_removed)&&!FREES_SLOT.includes(s.status)),free=agendaData.sessoes.filter(s=>!Number(s.slot_removed)&&FREES_SLOT.includes(s.status)).length;
  const n=st=>live.filter(s=>s.status===st).length,pl=(k,one,many)=>k+' '+(k===1?one:many),prev=live.reduce((a,s)=>a+Number(s.value||0),0),c=[`<span class="chip">${pl(live.length,'sessão','sessões')} na semana</span>`];
  if(n('Realizada'))c.push(`<span class="chip g">${pl(n('Realizada'),'realizada','realizadas')}</span>`);
  if(n('Faltou'))c.push(`<span class="chip r">${pl(n('Faltou'),'falta','faltas')}</span>`);
  if(free)c.push(`<span class="chip b">${pl(free,'desmarcada','desmarcadas')}</span>`);
  if(agPending.total)c.push(`<button class="chip a" onclick="openPending()" title="Clique para revisar">⚠ ${agPending.total} de dias anteriores sem status</button>`);
  if(prev)c.push(`<span class="chip p">Previsto na semana: <b>${money(prev)}</b></span>`);
  $('agChips').innerHTML=c.join('')}
function renderDayPanel(){
  const ds=agDay,tod=todayIso(),d=new Date(ds+'T12:00:00'),wd=WEEKDAYS_LONG[d.getDay()];
  const sess=agendaData.sessoes.filter(s=>s.session_date===ds&&s.session_time&&!Number(s.slot_removed)).sort((a,b)=>a.session_time.localeCompare(b.session_time));
  const evs=agendaData.eventos.filter(e=>e.event_date===ds).sort((a,b)=>a.event_time.localeCompare(b.event_time));
  const marked=sess.filter(s=>s.status!=='Agendada').length,title=ds===tod?`Hoje · ${wd}, ${d.getDate()}`:`${wd[0].toUpperCase()+wd.slice(1)}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
  const btn=(id,st,cls,label)=>`<button class="${cls}" onclick="quickStatus(${id},'${st}')">${label}</button>`;
  const rows=[...sess.map(s=>({t:s.session_time,html:s.status==='Agendada'
    ?`<div class="pi"><div class="h" onclick="openSession(event,${s.id})" title="Detalhes"><b>${esc(s.patient_name)}</b><span class="tmx">${s.session_time}</span></div><div class="acts">${btn(s.id,'Realizada','y','✓ Realizada')}${btn(s.id,'Faltou','f','✗ Faltou')}${btn(s.id,'Desmarcou','d','Desmarcou')}</div></div>`

function finOpenPatient(id){PT.sel=id;show('pacientes',document.querySelectorAll('nav button')[1]);loadPatients(true).then(()=>selectPatient(id))}
function extractText(p,s,pay,from){const today=iso(new Date()),fs=s.filter(x=>x.status!=='Agendada'&&x.session_date<=today&&(!from||x.session_date>=from)),fp=pay.filter(x=>!from||x.payment_date>=from),billed=x=>isBillableSession(x);
  const due=fs.filter(billed).reduce((a,x)=>a+Number(x.value||0),0),paid=fp.reduce((a,x)=>a+Number(x.amount||0),0),devido=s.filter(x=>x.session_date<=today&&billed(x)).reduce((a,x)=>a+Number(x.value||0),0),saldo=Math.max(0,Math.round((devido-pay.reduce((a,x)=>a+Number(x.amount||0),0))*100)/100);
  return `Olá, ${p.name}!\n\nExtrato de sessões\n${fs.slice(-30).map(x=>`${dmy(x.session_date)}  ${money(billed(x)?x.value:0)}  ${obsLabel(x)}`.trimEnd()).join('\n')}\n\nTotal período: ${money(due)}\nTotal pago: ${money(paid)}\nValor à receber: ${money(saldo)}`}
async function finWhatsApp(id){const d=await fetch('/api/pacientes/'+id).then(r=>r.json()),phone=String(d.paciente.whatsapp||'').replace(/\D/g,'');if(!phone)return toast('Este paciente não tem telefone cadastrado.');
  window.open('https://wa.me/55'+phone+'?text='+encodeURIComponent(extractText(d.paciente,d.sessoes,d.pagamentos,localStorage.getItem('patientHistoryFrom')||'')),'_blank')}
function finForecast(){const P=FIN.data.prevs;openModal('Previsão de faturamento',`<p class="muted">Baseada nos agendamentos das próximas 4 semanas (sessões ainda marcadas como “Agendada”).</p><table class="fin-table"><thead><tr><th>Semana</th><th>Período</th><th class="num">Sessões</th><th class="num">Valor</th></tr></thead><tbody>${P.periodos.map((x,i)=>`<tr><td>Semana ${i+1}</td><td>${dmy(x.inicio)} a ${dmy(x.fim)}</td><td class="num">${x.qtd}</td><td class="num"><b>${money(x.valor)}</b></td></tr>`).join('')}</tbody><tfoot><tr><td><b>Total</b></td><td></td><td class="num">${P.qtd}</td><td class="num"><b>${money(P.total)}</b></td></tr></tfoot></table>`,`<button class="primary" onclick="closeModal()">Fechar</button>`)}
function dmyToIso(v){const s=String(v||'').trim();if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){const [d,m,y]=s.split('/');return `${y}-${m}-${d}`}if(/^\d{2}-\d{2}-\d{4}$/.test(s)){const [d,m,y]=s.split('-');return `${y}-${m}-${d}`}if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;return null}
function isBillableSession(x){return ['Realizada','Faltou'].includes(x.status)||(x.status==='Desmarcou'&&Number(x.billable_override||0)===1)}

async function patientCell(el){const box=el.closest('[data-pid]'),id=Number(box.dataset.pid),old=JSON.parse(box.dataset.old),g=f=>box.querySelector(`[data-f="${f}"]`);
  const freq=g('frequencia').value;g('data_inicio_frequencia').closest('label').classList.toggle('hidden',freq!=='Quinzenal');
  const b={nome:g('nome').value.trim(),telefone:g('telefone').value,valor_sessao:g('valor_sessao').value,dia_preferencial:g('dia_preferencial').value,horario_preferencial:g('horario_preferencial').value,frequencia:freq,data_inicio_frequencia:freq==='Quinzenal'?(g('data_inicio_frequencia').value||''):'',observacoes:g('observacoes').value};
  if(!b.nome){toast('O nome não pode ficar vazio.');return setPatientForm(box,old)}
  if(b.valor_sessao===''||Number(b.valor_sessao)<0){toast('Informe um valor de sessão válido.');return setPatientForm(box,old)}
  if(!b.horario_preferencial){toast('Informe o horário preferencial.');return setPatientForm(box,old)}
  if(freq==='Quinzenal'&&!b.data_inicio_frequencia){toast('Informe a data de referência para salvar a frequência quinzenal.');g('data_inicio_frequencia').focus();return}
  const r=await fetch('/api/pacientes/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({...b,data_inicio_frequencia:b.data_inicio_frequencia||null})});const j=await r.json().catch(()=>({}));
  if(!r.ok){toast(j.error||'Não foi possível salvar.');return setPatientForm(box,old)}

  if($('ptName'))$('ptName').textContent=b.nome;
  const sum=box.querySelector('.pt-card-head .muted');if(sum)sum.textContent=`${weekdayName(b.dia_preferencial)} ${b.horario_preferencial} · ${freq==='Quinzenal'?'a cada 14 dias':'semanal'} · ${money(b.valor_sessao)}`;
  loadPatients(true);
  const sched=['dia_preferencial','horario_preferencial','frequencia','data_inicio_frequencia'].some(k=>String(old[k]||'')!==String(b[k]||''));if(sched)offerFill(id)}

  if(!pr.ok)toast(pj.error||'Erro ao preencher agenda');else toast(`Agenda preenchida: ${pj.created||0} sessões adicionadas; ${pj.skipped||0} conflitos ignorados.`);loadAgenda()}
function openPatientModal(id=null){if(id){fetch('/api/pacientes/'+id).then(r=>r.json()).then(d=>showPatientModal(d.paciente))}else showPatientModal(null)}
function showPatientModal(p){const isEdit=!!p;openModal(isEdit?'Editar paciente':'Novo paciente',`<div class="formgrid"><label class="full">Nome<input id="pNome" value="${esc(p?.name||'')}"></label><label>Telefone / WhatsApp<input id="pTel" value="${esc(p?.whatsapp||'')}"></label><label>Valor da sessão<input id="pFee" type="number" min="0" step="0.01" value="${p?.fee??''}"></label><label>Frequência<select id="pFrequency" onchange="document.getElementById('pStartWrap').classList.toggle('hidden',this.value!=='Quinzenal')"><option value="Semanal" ${(p?.frequency||'Semanal')==='Semanal'?'selected':''}>Semanal</option><option value="Quinzenal" ${p?.frequency==='Quinzenal'?'selected':''}>A cada 14 dias (quinzenal)</option></select></label><label id="pStartWrap" class="${p?.frequency==='Quinzenal'?'':'hidden'}">Data de referência<input id="pStart" type="date" value="${esc(p?.frequency_start||'')}"></label><label>Dia preferencial<select id="pDay">${DAYS.map((d,i)=>`<option value="${i}" ${Number(p?.weekday)===i?'selected':''}>${d}</option>`).join('')}</select></label><label>Horário preferencial<input id="pTime" type="time" value="${esc(p?.habitual_time||'')}"></label><label class="full">Observações<textarea id="pNotes" rows="2">${esc(p?.notes||'')}</textarea></label></div>`,`<button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="savePatient(${p?.id||'null'})">${isEdit?'Salvar':'Cadastrar'}</button>`)}
async function savePatient(id){const old=id?await fetch('/api/pacientes/'+id).then(r=>r.json()).then(d=>d.paciente):null;const b={nome:$('pNome').value,telefone:$('pTel').value,observacoes:$('pNotes').value,valor_sessao:$('pFee').value,dia_preferencial:$('pDay').value,horario_preferencial:$('pTime').value,frequencia:$('pFrequency').value,data_inicio_frequencia:$('pStart').value||null};const changed=!!old&&(Number(old.weekday)!==Number(b.dia_preferencial)||String(old.habitual_time||'')!==String(b.horario_preferencial||'')||String(old.frequency||'Semanal')!==b.frequencia||String(old.frequency_start||'')!==String(b.data_inicio_frequencia||''));if(b.frequencia==='Quinzenal'&&!b.data_inicio_frequencia)return toast('Informe a data de referência para a frequência quinzenal.');const url=id?'/api/pacientes/'+id:'/api/pacientes';const r=await fetch(url,{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)return toast(j.error||'Erro');closeModal();toast(id?'Paciente atualizado.':'Paciente cadastrado.');loadPatients(true).then(()=>{if(!id&&j.id)selectPatient(j.id)});if(changed)offerFill(id)}
async function togglePatient(id,active){const r=await fetch('/api/pacientes/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({active:!!active})});const j=await r.json();if(!r.ok)return toast(j.error||'Erro');toast(active?'Paciente ativado.':'Paciente desativado.');await loadPatients(true);detail(id)}

function monthKey(y,m){return y+'-'+String(m).padStart(2,'0')}
function addMonth(key,n){let [y,m]=key.split('-').map(Number);m+=n;while(m>12){y++;m-=12}while(m<1){y--;m+=12}return monthKey(y,m)}
function monthsBetween(from,to){const out=[];let k=from;while(k<=to){out.push(k);k=addMonth(k,1)}return out}
async function openPaymentControl(id){
  const d=await fetch('/api/pacientes/'+id).then(r=>r.json()), p=d.paciente;
  const from=loadPatientHistoryFrom()||d.sessoes.filter(x=>x.session_date<=iso(new Date())).map(x=>x.session_date).sort()[0]||iso(new Date());
  const today=iso(new Date()), start=from>today?today:from, end=today;
  const sessions=d.sessoes.filter(x=>x.session_date<=end).sort((a,b)=>(a.session_date+a.session_time).localeCompare(b.session_date+b.session_time));
  const payments=d.pagamentos.filter(x=>x.payment_date<=end).sort((a,b)=>a.payment_date.localeCompare(b.payment_date)||a.id-b.id);
  const first=start.slice(0,7), last=end.slice(0,7), months=monthsBetween(first,last);
  const openingDue=sessions.filter(x=>x.session_date<start&&isBillableSession(x)).reduce((a,x)=>a+Number(x.value||0),0);
  const openingPaid=payments.filter(x=>x.payment_date<start).reduce((a,x)=>a+Number(x.amount||0),0);
  let saldoAcumulado=Math.round((openingDue-openingPaid)*100)/100;
  const data=[];
  for(const m of months){
    const ss=sessions.filter(x=>x.session_date.slice(0,7)===m && x.session_date>=start);
    const pp=payments.filter(x=>x.payment_date.slice(0,7)===m && x.payment_date>=start);
    const due=ss.filter(isBillableSession).reduce((a,x)=>a+Number(x.value||0),0);
    const paid=pp.reduce((a,x)=>a+Number(x.amount||0),0);
    saldoAcumulado=Math.round((saldoAcumulado+due-paid)*100)/100;
    if(ss.length||pp.length||m===first)data.push({mes:m,sessoes:ss,pagamentos:pp});
  }
  paymentTextState={p,data,saldoFinal:saldoAcumulado,from:start};
  const text=buildPaymentText();
  openModal(`Controle de pagamentos • ${p.name}`,`<p class="muted">Extrato mensal desde <b>${dmy(start)}</b>. O texto abaixo pode ser personalizado antes do envio.</p><label style="display:block;font-size:11px;color:#555;margin-bottom:8px">Mensagem personalizada (opcional)<textarea id="waCustom" rows=3 style="width:100%" placeholder="Digite uma mensagem antes do extrato..."></textarea></label><label style="display:block;font-size:11px;color:#555">Texto para WhatsApp<textarea id="waText" rows=18 style="width:100%;font-family:Segoe UI,Arial,sans-serif;white-space:pre-wrap"></textarea></label>`,`<div class="wa-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="secondary" onclick="copyPaymentText()">📋 Copiar texto</button><button class="primary" onclick="copyPaymentTextAndOpenWhatsApp()">💬 Copiar e abrir WhatsApp</button></div>`);
  $('waText').value=text;
  $('waCustom').addEventListener('input',()=>{$('waText').value=buildPaymentText($('waCustom').value)});
}
function buildPaymentText(custom=''){
  const st=paymentTextState;if(!st)return '';
  let lines=[];if(custom.trim())lines.push(custom.trim(),'');
  for(const x of st.data){
    const month=MONTHS[Number(x.mes.slice(5))-1][0].toUpperCase()+MONTHS[Number(x.mes.slice(5))-1].slice(1);
    lines.push(`*${month} ${x.mes.slice(0,4)}*`);
    if(x.sessoes.length){
      for(const ss of x.sessoes){lines.push(`${dmy(ss.session_date)} – ${money(ss.value)}`);}
    }
    lines.push('*Pagamentos*');
    if(x.pagamentos.length){for(const pg of x.pagamentos)lines.push(`${dmy(pg.payment_date)} – ${money(pg.amount)}`);}else lines.push('Nenhum pagamento');
    if(x!==st.data[st.data.length-1]) lines.push('');
  }
  lines.push('');
  lines.push(`*Saldo à pagar: ${money(st.saldoFinal)}*`);
  return lines.join('\n').trim();
}
async function copyPaymentText(){const t=$('waText')?.value||buildPaymentText();if(!t)return;try{await navigator.clipboard.writeText(t);toast('Texto copiado.')}catch{const ta=$('waText');ta.focus();ta.select();document.execCommand('copy');toast('Texto copiado.')}}
async function copyPaymentTextAndOpenWhatsApp(){const st=paymentTextState;if(!st||!st.p.whatsapp)return toast('Paciente não possui WhatsApp cadastrado.');const t=$('waText')?.value||buildPaymentText();try{await navigator.clipboard.writeText(t)}catch{const ta=$('waText');ta.focus();ta.select();document.execCommand('copy')}const phone=String(st.p.whatsapp).replace(/\D/g,'');window.location.href='whatsapp://send?phone=55'+phone;toast('Texto copiado. Cole no WhatsApp com Ctrl+V.');}
let paymentTextState=null;

function downloadPatientReport(){
  const from=loadPatientHistoryFrom()||'';
  const url='/api/relatorio-pacientes'+(from?'?from='+encodeURIComponent(from):'');
  const a=document.createElement('a');a.href=url;a.download='relatorio-pacientes.xls';document.body.appendChild(a);a.click();a.remove();toast('Relatório Excel gerado.');
}
async function attachPatientFile(patientId){
  const input=document.createElement('input');input.type='file';input.multiple=true;
  input.onchange=async()=>{
    const files=[...input.files];
    for(const file of files){
      if(file.size>20*1024*1024){toast(`Arquivo ${file.name} maior que 20 MB.`);continue;}
      const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
      const res=await fetch('/api/pacientes/'+patientId+'/anexos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,mime_type:file.type||'application/octet-stream',data})});
      const j=await res.json();if(!res.ok){toast(j.error||'Não foi possível anexar o arquivo.');return;}
    }
    toast('Arquivo(s) anexado(s) ao paciente.');detail(patientId);
  };input.click();
}
async function deletePatientAttachment(id,patientId){
  if(!await confirmBox('Excluir este arquivo do paciente?',{title:'Excluir arquivo',okText:'Excluir',danger:true}))return;
  const r=await fetch('/api/anexos/'+id,{method:'DELETE'});const j=await r.json();if(!r.ok)return toast(j.error||'Não foi possível excluir.');toast('Arquivo excluído.');detail(patientId);
}
function formatBytes(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(1)+' KB';return (n/1024/1024).toFixed(1)+' MB'}

// A "Observação" é o status, como na planilha: faltou / sem antecedência (Faltou), desmarcou (Desmarcou),
// desmarquei / feriado... (Desmarquei). Sem palavra-chave, a observação é só um comentário da sessão.
const OBS_RULES=[[/desmarcou/,'Desmarcou'],[/d[e]s?marquei|feriad|congress|natal|ano novo|ferias|recesso/,'Desmarquei'],[/falt|sem anteced/,'Faltou'],[/realizad/,'Realizada']];
const obsNorm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function obsKeyword(text){const t=obsNorm(text);const r=OBS_RULES.find(([re])=>re.test(t));return r?r[1]:null}
function obsToStatus(text,current){return obsKeyword(text)||(['Faltou','Desmarcou','Desmarquei'].includes(current)?'Realizada':current)}
function obsLabel(x){const n=x.notes||'';if(x.status==='Realizada')return n;if(!n)return x.status;return (obsKeyword(n)===x.status||(x.status==='Agendada'&&/^agendad/.test(obsNorm(n))))?n:x.status+': '+n}
const OBS_SUGGESTIONS=['Faltou','Sem antecedência','Desmarcou','Desmarquei','Feriado'];
async function detail(id){
  PT.sel=id;const d=await fetch('/api/pacientes/'+id).then(r=>r.json());if(PT.sel!==id)return;
  const p=d.paciente,s=d.sessoes,pay=d.pagamentos,attachments=d.anexos||[];
  const from=localStorage.getItem('patientHistoryFrom')||'',todayIso=iso(new Date());
  const filteredS=s.filter(x=>x.status!=='Agendada'&&x.session_date<=todayIso&&(!from||x.session_date>=from)),filteredP=pay.filter(x=>!from||x.payment_date>=from); // sessões apenas agendadas não aparecem aqui
  const billed=x=>isBillableSession(x);
  const due=filteredS.filter(billed).reduce((a,x)=>a+Number(x.value||0),0),paid=filteredP.reduce((a,x)=>a+Number(x.amount||0),0);
  // O filtro altera os totais exibidos; o saldo é sempre o global do paciente (sessões passadas cobradas menos todos os pagamentos).
  const devidoGlobal=s.filter(x=>x.session_date<=todayIso&&billed(x)).reduce((a,x)=>a+Number(x.value||0),0);
  const saldoGlobal=Math.max(0,Math.round((devidoGlobal-pay.reduce((a,x)=>a+Number(x.amount||0),0))*100)/100);
  // Os pagamentos quitam primeiro as sessões cobradas mais antigas (FIFO); só fica verde a sessão integralmente coberta.
  let credito=Math.max(0,pay.reduce((t,x)=>t+Number(x.amount||0),0));const quitadas=new Set();
  for(const x of s.filter(billed).sort((a,b)=>(a.session_date+(a.session_time||'')+'-'+String(a.id)).localeCompare(b.session_date+(b.session_time||'')+'-'+String(b.id)))){
    const v=Math.max(0,Number(x.value||0));if(credito+0.005>=v){quitadas.add(Number(x.id));credito=Math.max(0,Math.round((credito-v)*100)/100)}else credito=0}
  const sessionRows=filteredS.slice().sort((a,b)=>(a.session_date+(a.session_time||'')).localeCompare(b.session_date+(b.session_time||''))).map(x=>`<tr data-session-row="${x.id}" class="${quitadas.has(Number(x.id))?'session-paid':(billed(x)&&x.session_date.slice(0,7)===todayIso.slice(0,7)?'session-due':'')}"><td><input class="hist-in" value="${esc(dmy(x.session_date))}" onchange="savePatientSessionInline(${x.id},this,'date')"></td><td><input class="hist-in val" type="number" step="0.01" value="${(billed(x)?Number(x.value||0):0).toFixed(2)}" ${billed(x)?'':'disabled title="Sessão sem cobrança. Para cobrar, apague a observação."'} onchange="savePatientSessionInline(${x.id},this,'value')"></td><td><input class="hist-in" list="obsSug" value="${esc(obsLabel(x))}" onchange="savePatientSessionInline(${x.id},this,'obs')"></td></tr>`).join('');
  const payRows=filteredP.slice().sort((a,b)=>a.payment_date.localeCompare(b.payment_date)).map(x=>`<tr data-payment-row="${x.id}"><td><input class="hist-in" value="${esc(dmy(x.payment_date))}" onchange="savePatientPaymentInline(${x.id},this,'date')"></td><td><input class="hist-in val" type="number" step="0.01" value="${Number(x.amount||0).toFixed(2)}" onchange="savePatientPaymentInline(${x.id},this,'value')"></td><td><input class="hist-in" value="${esc(x.notes||'')}" onchange="savePatientPaymentInline(${x.id},this,'note')"></td></tr>`).join('');
  const phone=(p.whatsapp||'').replace(/\D/g,'');
  PT.waText=extractText(p,s,pay,from);
  const q=patientRowData(p),quin=q.frequencia==='Quinzenal',open=ptFormOpen();
  const attach=`<details class="pt-card att"><summary>Arquivos anexados (${attachments.length})</summary><div class="patient-attachments-list" style="margin-top:8px">${attachments.length?attachments.map(a=>`<div class="patient-attachment-row"><span><a href="/api/anexos/${a.id}" target="_blank">📄 ${esc(a.filename)}</a> <span class="meta">(${formatBytes(a.size)})</span></span><button class="secondary" onclick="deletePatientAttachment(${a.id},${p.id})">Excluir</button></div>`).join(''):'<span class="muted">Nenhum arquivo anexado.</span>'}</div><div style="margin-top:8px"><button class="secondary" onclick="attachPatientFile(${p.id})">📎 Anexar arquivo</button></div></details>`;
  const stat=(a,b,c='')=>`<div class="pt-stat ${c}"><span>${a}</span><b>${b}</b></div>`;
  const sc=PT.rendered===id?[...document.querySelectorAll('#ptDetail .pt-scroll')].map(e=>e.scrollTop):[];
  $('ptDetail').innerHTML=`<div class="pt-head"><div class="who"><span class="avatar lg">${esc(ptInitials(p.name))}</span><div style="min-width:0"><h2 id="ptName">${esc(p.name)}</h2><div class="pt-sub2">${esc(p.whatsapp||'sem telefone')} <span class="chip ${p.active?'g':'n'}">${p.active?'Ativo':'Inativo'}</span></div></div></div>
  <div class="pt-actions"><button class="primary" onclick="addPatientPayment(${p.id})">＋ Registrar pagamento</button><button class="secondary" onclick="openPaymentControl(${p.id})">Controle de pagamentos</button>
  <details class="menu"><summary title="Mais ações">⋯</summary><div class="menu-pop">${phone?`<button onclick="ptWhatsApp('${phone}')">💬 Enviar extrato por WhatsApp</button>`:''}<button onclick="attachPatientFile(${p.id})">📎 Anexar arquivo</button><button class="danger" onclick="deletePatientSchedule(${p.id})">🗑 Excluir agendamentos futuros</button><button onclick="togglePatient(${p.id},${p.active?0:1})">${p.active?'Desativar paciente':'Ativar paciente'}</button></div></details></div></div>
  <div class="pt-stats">${stat('Total período',money(due))}${stat('Total pago',money(paid))}${stat('Valor à receber',money(saldoGlobal),saldoGlobal?'warn':'ok')}<label class="pt-from">Mostrar a partir de<input id="patientHistoryFrom" type="date" value="${esc(from)}" onchange="savePatientHistoryFrom();detail(${p.id})"></label></div>
  <div class="pt-card" id="ptForm" data-pid="${p.id}" data-old="${esc(JSON.stringify(q))}"><div class="pt-card-head" onclick="ptToggleForm()"><h3>Cadastro</h3><span class="muted">${weekdayName(p.weekday)} ${esc(p.habitual_time||'')} · ${quin?'a cada 14 dias':'semanal'} · ${money(p.fee)}</span><span class="chev" id="ptChev">${open?'▾':'▸'}</span></div>
  <div class="pt-form ${open?'':'hidden'}" id="ptFormBody"><label class="wide">Nome<input data-f="nome" value="${esc(q.nome)}" onchange="patientCell(this)"></label><label>Telefone / WhatsApp<input data-f="telefone" value="${esc(q.telefone)}" onchange="patientCell(this)"></label><label>Valor da sessão<input data-f="valor_sessao" type="number" min="0" step="0.01" value="${esc(q.valor_sessao)}" onchange="patientCell(this)"></label>
  <label>Frequência<select data-f="frequencia" onchange="patientCell(this)"><option value="Semanal" ${quin?'':'selected'}>Semanal</option><option value="Quinzenal" ${quin?'selected':''}>A cada 14 dias</option></select></label><label>Dia<select data-f="dia_preferencial" onchange="patientCell(this)">${DAYS.map((d,i)=>`<option value="${i}" ${q.dia_preferencial===String(i)?'selected':''}>${d}</option>`).join('')}</select></label><label>Horário<input data-f="horario_preferencial" type="time" value="${esc(q.horario_preferencial)}" onchange="patientCell(this)"></label>
  <label class="${quin?'':'hidden'}">Data de referência<input data-f="data_inicio_frequencia" type="date" value="${esc(q.data_inicio_frequencia)}" onchange="patientCell(this)"></label><label class="wide">Observações<input data-f="observacoes" value="${esc(q.observacoes)}" onchange="patientCell(this)"></label></div></div>
  <div class="pt-cols"><div class="pt-card"><h3>Sessões</h3><div class="pt-scroll"><table class="hist-table"><thead><tr><th>Data</th><th>Valor</th><th>Observação</th></tr></thead><tbody>${sessionRows||'<tr><td colspan="3" class="muted">Nenhuma sessão.</td></tr>'}</tbody></table></div></div>
  <div class="pt-card"><h3>Pagamentos</h3><div class="pt-scroll"><table class="hist-table"><thead><tr><th>Data</th><th>Valor</th><th>Observação</th></tr></thead><tbody>${payRows||'<tr><td colspan="3" class="muted">Nenhum pagamento.</td></tr>'}</tbody></table></div></div></div>
  <datalist id="obsSug">${OBS_SUGGESTIONS.map(o=>`<option value="${o}">`).join('')}</datalist>${attach}`;
  PT.rendered=id;document.querySelectorAll('#ptDetail .pt-scroll').forEach((e,i)=>{e.scrollTop=sc[i]||0});
}
async function addPatientPayment(id,prev={}){
  const v=await dialogBox('Registrar pagamento',`<div class="formgrid"><label>Data do pagamento<input id="dlgDate" type="date" value="${esc(prev.data||iso(new Date()))}"></label><label>Valor<input id="dlgInput" type="number" min="0" step="0.01" placeholder="0,00" value="${esc(prev.valor||'')}"></label></div>`,[{label:'Cancelar',value:null},{label:'Salvar',cls:'primary',collect:()=>({data:$('dlgDate').value,valor:$('dlgInput').value})}]);
  if(!v)return;
  if(!v.data||!(Number(v.valor)>0)){toast('Informe a data e um valor maior que zero.');return addPatientPayment(id,v)}
  const r=await fetch('/api/pagamentos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({patient_id:id,data:v.data,valor:v.valor})});const j=await r.json().catch(()=>({}));
  if(!r.ok)return toast(j.error||'Não foi possível registrar o pagamento.');
  toast('Pagamento registrado.');loadPatients();loadFinance();detail(id);
}
async function savePatientSessionInline(id,el,field){
  const rows=await fetch('/api/sessoes').then(r=>r.json());const x=rows.find(r=>Number(r.id)===Number(id));if(!x)return toast('Sessão não encontrada.');
  const b={};if(field==='date'){const v=dmyToIso(el.value);if(!v)return toast('Data inválida. Use DD/MM/AAAA.');b.data=v}else if(field==='value')b.valor=el.value;
  else if(field==='obs'){b.observacao=el.value.trim();b.status=obsToStatus(el.value,x.status)}
  const r=await fetch('/api/financeiro/sessoes/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)return toast(j.error||'Não foi possível salvar.');toast('Lançamento atualizado.');loadPatients();detail(x.patient_id);
}
async function savePatientPaymentInline(id,el,field){
  const rows=await fetch('/api/pagamentos').then(r=>r.json());const x=rows.find(r=>Number(r.id)===Number(id));if(!x)return toast('Pagamento não encontrado.');
  const b={};if(field==='date'){const v=dmyToIso(el.value);if(!v)return toast('Data inválida. Use DD/MM/AAAA.');b.data=v}else if(field==='value')b.valor=el.value;else if(field==='note')b.observacao=el.value;
  const r=await fetch('/api/pagamentos/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)return toast(j.error||'Não foi possível salvar.');toast('Pagamento atualizado.');loadPatients();detail(x.patient_id);
}

loadPatientHistoryFrom();applyScale();loadAgenda();
