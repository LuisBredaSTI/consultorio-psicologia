<aside class="pt-list">
<div class="pt-list-head"><h1>Pacientes</h1><button class="primary" onclick="openPatientModal()">＋ Novo</button></div>
<div class="pt-sub" id="ptSub"></div>
<div class="pt-search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="ptSearch" placeholder="Buscar por nome ou telefone…" oninput="PT.q=this.value;renderPatientList()"></div>
<div class="seg" id="ptSeg"><button class="on" data-v="ativos" onclick="ptSetStatus('ativos')">Ativos</button><button data-v="inativos" onclick="ptSetStatus('inativos')">Inativos</button><button data-v="todos" onclick="ptSetStatus('todos')">Todos</button></div>
<label class="pt-opt"><input type="checkbox" onchange="PT.onlyDue=this.checked;renderPatientList()"> só com saldo a receber</label>
<div class="pt-items" id="ptList"></div>
<button class="secondary" onclick="downloadPatientReport()">📊 Relatório Excel</button>
</aside>
<div class="pt-detail" id="ptDetail"><div class="pt-empty">Carregando…</div></div>
</div>
</section>
<section id="financeiro" class="hidden"><div class="toolbar"><h1>Financeiro</h1><input id="mesFin" type="month" onchange="loadFinance()"><button class="primary" onclick="openPaymentModal()">＋ Registrar pagamento</button><button class="secondary" onclick="openImport()">📥 Importar planilha</button><button class="secondary" onclick="loadFinance()">Atualizar</button><label class="small">Ano <select id="financeYear" onchange="loadFinanceAnnual()"></select></label></div><div id="financeForecast" class="finance-forecast"></div><div id="financeCards" class="finance-cards"></div><div class="panel"><h2 style="font-size:15px;margin:0 0 8px">Resumo anual</h2><div id="financeAnnual" class="annual-summary"></div></div></section>


</main></div>
<div id="modalRoot"></div><div id="dlgRoot"></div><div id="toast" class="toast"></div>
<script>
fetch('/api/health').then(r=>r.json()).then(h=>{const e=document.getElementById('appVersion');if(e&&h.version)e.textContent='V'+h.version}).catch(()=>{});
const $=id=>document.getElementById(id); const money=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const STATUS=[['Agendada','agendada'],['Realizada','realizada'],['Desmarcou','ca'],['Desmarquei','ca'],['Faltou','faltou']];
// Desmarcou (paciente) e Desmarquei (profissional): liberam o horário e não geram cobrança
const FREES_SLOT=['Desmarcou','Desmarquei'];
const DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']; const MONTHS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const TIMES=[]; for(let h=7;h<=20;h++) TIMES.push(String(h).padStart(2,'0')+':00');
let weekStart=monday(new Date()),agendaData={sessoes:[],locks:[],eventos:[]};
function pad(n){return String(n).padStart(2,'0')} function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())} function dmy(v){if(!v)return '—';const p=String(v).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(v)} function monday(d){let x=new Date(d);x.setHours(12,0,0,0);let day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));return x} function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x} function fmt(d){return dmy(iso(d))}
function show(id,btn){document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');if(id==='inicio'){loadAgenda()}if(id==='pacientes')loadPatients();if(id==='financeiro')loadFinance();}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2600)} function changeWeek(n){weekStart=addDays(weekStart,n*7);loadAgenda()} function goToday(){weekStart=monday(new Date());loadAgenda()}

/* Caixas de diálogo próprias (substituem confirm/prompt do navegador) */
let _dlg=null;
function dialogBox(title,body,buttons){return new Promise(res=>{_dlg={res,buttons};$('dlgRoot').innerHTML=`<div class="modalback" style="z-index:3000" onclick="if(event.target===this)dlgClick(-1)"><div class="modal" style="width:min(440px,94vw)"><h2>${esc(title)}</h2>${body}<div class="modalfooter">${buttons.map((b,i)=>`<button class="${b.cls||'secondary'}" onclick="dlgClick(${i})">${esc(b.label)}</button>`).join('')}</div></div></div>`;const inp=$('dlgInput');if(inp){inp.focus();try{inp.select()}catch(e){}}document.querySelectorAll('#dlgRoot input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')dlgClick(buttons.findIndex(b=>b.input||b.collect))})})}
function dlgClick(i){if(!_dlg)return;const {res,buttons}=_dlg;_dlg=null;const b=buttons[i],inp=$('dlgInput');const val=b?(b.collect?b.collect():b.input?(inp?inp.value:''):b.value):null;$('dlgRoot').innerHTML='';res(val)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&_dlg)dlgClick(-1)});
function confirmBox(msg,o={}){return dialogBox(o.title||'Confirmar',`<p>${esc(msg)}</p>`,[{label:o.cancelText||'Cancelar',value:false},{label:o.okText||'Confirmar',value:true,cls:o.danger?'secondary danger':'primary'}]).then(v=>!!v)}
function promptBox(title,label,o={}){return dialogBox(title,`<label style="display:block;font-size:12px;color:#555">${esc(label)}<input id="dlgInput" type="${o.type||'text'}" value="${esc(o.value||'')}" placeholder="${esc(o.placeholder||'')}" style="display:block;width:100%;margin-top:6px;box-sizing:border-box"></label>`,[{label:'Cancelar',value:null},{label:o.okText||'OK',input:true,cls:'primary'}])}
function choiceBox(title,msg,buttons){return dialogBox(title,`<p>${esc(msg)}</p>`,buttons)}

function lockFor(date,time){return agendaData.locks.find(l=>l.lock_date===date && (l.start_time===null||l.start_time===time))} function slotSessions(date,time){return agendaData.sessoes.filter(s=>s.session_date===date&&s.session_time&&s.session_time.slice(0,2)===time.slice(0,2)&&!Number(s.slot_removed))} function sessionFor(date,time){return slotSessions(date,time).find(s=>!FREES_SLOT.includes(s.status))} function cancelledGhosts(date,time){return slotSessions(date,time).filter(s=>FREES_SLOT.includes(s.status))} function eventsFor(date,time){return (agendaData.eventos||[]).filter(e=>e.event_date===date&&e.event_time.slice(0,2)===time.slice(0,2))}
async function loadAgenda(){const start=iso(weekStart),end=iso(addDays(weekStart,6));const d=await fetch(`/api/agenda?start=${start}&end=${end}`).then(r=>r.json());agendaData=d;$('weekTitle').textContent=`${fmt(weekStart)} – ${fmt(addDays(weekStart,6))}`;renderCalendar();renderHistory() ;}
function getAgendaSettings(){try{return JSON.parse(localStorage.getItem('agendaSettings')||'{}')}catch{return {}}}
const defaultAgendaSettings={version:2,hiddenDays:[5,6],hiddenTimes:[],rowHeight:60,dayWidths:{0:120,1:120,2:120,3:120,4:120,5:120,6:120},timeCol:55};
function agendaSettings(){
  const raw=getAgendaSettings();
  if(Number(raw.version||0)<2){localStorage.removeItem('agendaSettings');return {...defaultAgendaSettings,dayWidths:{...defaultAgendaSettings.dayWidths}}}
  return {...defaultAgendaSettings,...raw,dayWidths:{...defaultAgendaSettings.dayWidths,...(raw.dayWidths||{})}};
}
function applyAgendaCss(){const a=agendaSettings();document.documentElement.style.setProperty('--row-height',a.rowHeight+'px');document.documentElement.style.setProperty('--day-width',a.dayWidths[0]+'px');document.documentElement.style.setProperty('--time-col',a.timeCol+'px')}
function visibleTimes(){const a=agendaSettings();return TIMES.filter(t=>!a.hiddenTimes.includes(t))}
function visibleDayOffsets(){const a=agendaSettings();return [0,1,2,3,4,5,6].filter(i=>!a.hiddenDays.includes(i))}
function renderCalendar(){
  applyAgendaCss();
  const a=agendaSettings(), offsets=visibleDayOffsets();
  let h='<div></div>';
  for(const offset of offsets){
    const d=addDays(weekStart,offset),ds=iso(d),dayLock=agendaData.locks.find(l=>l.lock_date===ds&&l.start_time===null);
    h+=`<div class="dayhead ${dayLock?'daylocked':''}" style="min-width:${a.dayWidths[offset]}px">${DAYS[d.getDay()]}<small>${fmt(d)} ${dayLock?'🔒':''}</small></div>`;
  }
  const cols=offsets.map(i=>`${a.dayWidths[i]}px`).join(' ');
  const grid=`var(--time-col) ${cols}`;
  $('calHead').style.gridTemplateColumns=grid;
  $('calBody').style.gridTemplateColumns=grid;
  $('calHead').innerHTML=h;
  let b='';
  for(const t of visibleTimes()){
    b+=`<div class="timecell">${t}</div>`;
    for(const offset of offsets){
      const d=addDays(weekStart,offset),ds=iso(d),lock=lockFor(ds,t),s=sessionFor(ds,t),ghosts=cancelledGhosts(ds,t),evs=eventsFor(ds,t);
      b+=`<div class="slot ${lock?'locked':''} ${!s&&!lock&&!evs.length?'empty':''}" style="min-width:${a.dayWidths[offset]}px" ondragover="allowDrop(event)" ondrop="dropSlot(event,'${ds}','${t}')" onclick="emptySlotClick(event,'${ds}','${t}')" oncontextmenu="slotContextMenu(event,'${ds}','${t}');return false;">${lock?`<div class="small"><b>🔒</b><br>${esc(lock.reason)}<br><button class="secondary" style="font-size:9px;padding:2px 5px;margin-top:4px" onclick="unlock(event,${lock.id})">Destravar</button></div>`:ghosts.map(cancelledGhostHtml).join('')+(s?appointment(s):'')+evs.map(personalEvent).join('')}</div>`;
    }
  }
  $('calBody').innerHTML=b;
}
function cancelledGhostHtml(s){const mine=s.status==='Desmarquei';return `<div class="cancelled-ghost ${mine?'mine':''}" onclick="openGhostActions(event,${s.id})" title="${mine?'Você desmarcou':'Paciente desmarcou'}; horário disponível. Clique para reverter ou reagendar">${esc(s.patient_name)} — ${mine?'desmarquei':'desmarcou'}</div>`}
async function openGhostActions(e,id){e.stopPropagation();const s=agendaData.sessoes.find(x=>x.id===id);if(!s)return;const mine=s.status==='Desmarquei';
  const act=await choiceBox(mine?'Sessão desmarcada por você':'Sessão desmarcada pelo paciente',`${s.patient_name} — ${dmy(s.session_date)} às ${s.session_time}. O horário está livre e esta sessão não gera cobrança.`,[{label:'Fechar',value:null},{label:'Reagendar',value:'r'},{label:'Voltar para Agendada',value:'v',cls:'primary'}]);
  if(act==='v')statusChange(id,'Agendada');else if(act==='r')openReschedule({preventDefault(){},stopPropagation(){}},id)} function appointment(s){const done=['Realizada','Faltou'].includes(s.status);const cls=s.status==='Realizada'?'done':FREES_SLOT.includes(s.status)?'status-ca':'status-faltou';const canDrag=!done&&!Number(s.slot_removed);let options=STATUS.map(x=>`<option value="${x[0]}" ${s.status===x[0]?'selected':''}>${x[0]}</option>`).join('');let react=(FREES_SLOT.includes(s.status)||s.status==='Faltou')?`<a href="#" onclick="openReschedule(event,${s.id})">reagendar?</a>`:'';return `<div class="appointment ${cls}" draggable="${canDrag}" ondragstart="dragStart(event,${s.id})" onclick="event.stopPropagation()"><div class="patient" title="${esc(s.patient_name)}">${esc(s.patient_name)}</div><div class="appt-actions"><select onchange="statusChange(${s.id},this.value)" ${s.status==='Realizada'?'disabled':''}>${options}</select>${react}</div><input class="note" value="${esc(s.notes||'')}" placeholder="observação" onblur="saveNote(${s.id},this.value)" onclick="event.stopPropagation()"></div>`}
function allowDrop(e){e.preventDefault()} let draggedId=null;function dragStart(e,id){draggedId=id;e.dataTransfer.setData('text/plain',String(id))}
async function dropSlot(e,date,time){e.preventDefault();e.stopPropagation();const id=Number(e.dataTransfer.getData('text/plain')||draggedId);if(!id)return;const s=agendaData.sessoes.find(x=>x.id===id);if(!s||['Realizada','Faltou'].includes(s.status))return toast('Sessões Realizada e Faltou não podem ser arrastadas.');if(sessionFor(date,time))return toast('Este horário já está ocupado.');if(lockFor(date,time))return toast('Este horário está travado.');const r=await fetch('/api/sessoes/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:date,horario:time})});const j=await r.json();if(!r.ok)return toast(j.error||'Não foi possível remanejar.');toast('Sessão remanejada.');loadAgenda()}
function slotContextMenu(e,date,time){
  e.preventDefault();e.stopPropagation();
  const s=sessionFor(date,time), ev=eventsFor(date,time)[0], lock=lockFor(date,time);
  if(s){
    confirmBox(`Excluir o agendamento de ${s.patient_name} em ${dmy(date)} às ${time}?`,{title:'Excluir agendamento',okText:'Excluir',danger:true}).then(ok=>{if(!ok)return;
      fetch('/api/sessoes/'+s.id+'/sem-reagendamento',{method:'POST'}).then(async r=>{const j=await r.json();if(!r.ok)return toast(j.error||'Não foi possível excluir o agendamento.');toast('Agendamento excluído do slot.');loadAgenda()});
    });
    return;
  }
  if(ev){deletePersonalEvent({stopPropagation(){},preventDefault(){}},ev.id);return;}
  if(lock){return;}
  lockSlot(e,date,time);
}
function emptySlotClick(e,date,time){if(e.target.closest('.appointment')||e.target.closest('.personal-event')||e.target.closest('.cancelled-ghost'))return;if(lockFor(date,time))return;openNewSessionChoice(date,time)}
function openNewSessionChoice(date,time){openModal('Novo compromisso',`<p>O que deseja incluir em <b>${dmy(date)} às ${time}</b>?</p>`,`<button class="secondary" onclick="openNewSession('${date}','${time}')">👤 Sessão de paciente</button><button class="primary" onclick="openPersonalEvent('${date}','${time}')">🏊 Compromisso pessoal</button>`)}
function openPersonalEvent(date,time){openModal('Novo compromisso pessoal',`<div class="formgrid"><label class="full">Título<input id="eTitle" placeholder="Ex.: Natação"></label><label>Data<input id="eDate" type="date" value="${date}"></label><label>Horário<input id="eTime" type="time" value="${time}"></label><label class="full">Observação<textarea id="eNote" rows="2"></textarea></label><label class="full repeat-check"><input id="eRepeat" type="checkbox" onchange="$('eWeeks').disabled=!this.checked"><span>Repetir nas próximas semanas no mesmo dia e horário, por</span><input id="eWeeks" type="number" min="2" max="52" value="16" disabled style="width:64px"><span>semanas</span></label></div>`,`<button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="savePersonalEvent()">Salvar</button>`)}
async function savePersonalEvent(){const b={data:$('eDate').value,horario:$('eTime').value,titulo:$('eTitle').value,observacao:$('eNote').value,repetir:$('eRepeat').checked,semanas:Number($('eWeeks').value)||16};if(!b.titulo.trim())return toast('Informe o título.');const r=await fetch('/api/eventos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)return toast(j.error||'Não foi possível criar o compromisso.');closeModal();toast(repeatSummary('Compromisso',b.repetir,j.eventos.length,j.skipped));loadAgenda()}
function repeatSummary(what,repeat,created,skipped){return !repeat?what+(what==='Sessão'?' agendada.':' criado.'):`${what}: ${created} semana${created===1?'':'s'} criada${created===1?'':'s'}${skipped?`; ${skipped} ignorada${skipped===1?'':'s'} por conflito de horário`:''}.`}
async function deletePersonalEvent(e,id){e.stopPropagation();const ev=agendaData.eventos.find(x=>x.id===id);if(!ev)return;const scope=ev.series_id?await choiceBox('Excluir compromisso','Este compromisso se repete toda semana. O que deseja excluir?',[{label:'Cancelar',value:null},{label:'Somente este',value:'1',cls:'secondary'},{label:'Toda a série',value:'2',cls:'secondary danger'}]):'1';if(!scope)return;const r=await fetch('/api/eventos/'+id+'?scope='+(scope==='2'?'series':'one'),{method:'DELETE'});if(r.ok){toast(scope==='2'?'Toda a série foi excluída.':'Compromisso excluído.');loadAgenda()}else toast('Não foi possível excluir.')}
function personalEvent(e){return `<div class="personal-event" onclick="deletePersonalEvent(event,${e.id})" title="Clique para excluir"><b>🏊 ${e.event_time.slice(3)==='00'?'':esc(e.event_time)+' '}${esc(e.title)}</b><small>compromisso pessoal</small></div>`}
function renderHistory(){const past=agendaData.sessoes.filter(s=>!s.session_time||Number(s.slot_removed));if(!past.length){$('historyBox').innerHTML='';return}let rows=past.map(s=>`<tr><td>${dmy(s.session_date)}</td><td>${s.session_time||'—'}</td><td>${esc(s.patient_name)}</td><td>${esc(s.status)}</td><td>${money(s.value)}</td></tr>`).join('');$('historyBox').innerHTML=`<details><summary>Histórico / sessões anteriores ou liberadas (${past.length})</summary><table><thead><tr><th>Data</th><th>Hora</th><th>Paciente</th><th>Status</th><th>Valor</th></tr></thead><tbody>${rows}</tbody></table></details>`}
function openModal(title,body,actions=''){$('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2>${body}${actions?`<div class="modalfooter">${actions}</div>`:''}</div></div>`}function closeModal(){$('modalRoot').innerHTML=''}
async function openNewSession(date,time){const patients=await fetch('/api/pacientes?status=ativos').then(r=>r.json());if(!patients.length)return toast('Cadastre um paciente ativo primeiro.');openModal('Agendar sessão',`<div class="formgrid"><label>Paciente<select id="mPatient">${patients.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Data<input id="mDate" type="date" value="${date}"></label><label>Horário<input id="mTime" type="time" value="${time}"></label><label class="full">Observação<textarea id="mNote" rows="3"></textarea></label><label class="full repeat-check"><input id="mRepeat" type="checkbox" onchange="$('mWeeks').disabled=!this.checked"><span>Repetir nas próximas semanas no mesmo dia e horário, por</span><input id="mWeeks" type="number" min="2" max="52" value="16" disabled style="width:64px"><span>semanas</span></label></div>`,`<button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="createSession()">Agendar</button>`)}
async function createSession(){const b={patient_id:Number($('mPatient').value),data:$('mDate').value,horario:$('mTime').value,status:'Agendada',observacao:$('mNote').value,repetir:$('mRepeat').checked,semanas:Number($('mWeeks').value)||16};const r=await fetch('/api/sessoes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)return toast(j.error||'Erro');closeModal();toast(repeatSummary('Sessão',b.repetir,j.criadas,j.ignoradas));loadAgenda()}
async function statusChange(id,status){const r=await fetch('/api/sessoes/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,slot_removed:0})});const j=await r.json();if(!r.ok)return toast(j.error||'Erro');loadAgenda()}
async function saveNote(id,note){const r=await fetch('/api/sessoes/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({observacao:note})});if(r.ok)toast('Observação salva.');else toast('Não foi possível salvar a observação.')}
function openReschedule(e,id){e.preventDefault();e.stopPropagation();const s=agendaData.sessoes.find(x=>x.id===id);if(!s)return;openModal('Reagendar sessão',`<p><b>${esc(s.patient_name)}</b><br>Original: ${dmy(s.session_date)} ${s.session_time||''}</p><div class="formgrid"><label>Nova data<input id="rDate" type="date" value="${s.session_date}"></label><label>Novo horário<input id="rTime" type="time" value="${s.session_time||'08:00'}"></label></div><p class="muted">O horário original será liberado e a sessão original ficará preservada no histórico.</p>`,`<button class="secondary" onclick="noReschedule(${id})">Sem reagendamento</button><button class="primary" onclick="doReschedule(${id})">Reagendar</button>`)}
async function doReschedule(id){const r=await fetch('/api/sessoes/'+id+'/reagendar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:$('rDate').value,horario:$('rTime').value})});const j=await r.json();if(!r.ok)return toast(j.error||'Erro ao reagendar');closeModal();toast('Sessão reagendada.');loadAgenda()}
async function noReschedule(id){const r=await fetch('/api/sessoes/'+id+'/sem-reagendamento',{method:'POST'});const j=await r.json();if(!r.ok)return toast(j.error||'Erro');closeModal();toast('Sessão liberada e mantida no histórico.');loadAgenda()}
function openLockDay(){openModal('Travar período da agenda',`<div class="formgrid"><label>Travar de<input id="lockFrom" type="date" value="${iso(weekStart)}"></label><label>Até<input id="lockTo" type="date" value="${iso(addDays(weekStart,6))}"></label><label class="full">Motivo<input id="lockReason" value="Férias"></label></div>`,`<button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveLockRange()">Travar período</button>`)}
async function saveLockRange(){const r=await fetch('/api/travar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inicio:$('lockFrom').value,fim:$('lockTo').value,motivo:$('lockReason').value})});const j=await r.json();if(!r.ok)return toast(j.error||'Erro');closeModal();toast('Período travado.');loadAgenda()}
async function lockCreate(date,time,reason){const r=await fetch('/api/travar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:date,horario:time,motivo:reason})});const j=await r.json();if(!r.ok)return toast(j.error||'Erro');toast('Agenda travada.');loadAgenda()}
async function lockSlot(e,date,time){e.stopPropagation();const existing=lockFor(date,time);if(existing)return unlock(e,existing.id);const reason=await promptBox('Travar horário',`Motivo para travar ${dmy(date)} às ${time}:`,{placeholder:'Ex.: reunião, folga...'});if(!reason)return;await lockCreate(date,time,reason)}
async function unlock(e,id){e.stopPropagation();if(!await confirmBox('Destravar este período da agenda?',{title:'Destravar',okText:'Destravar'}))return;const r=await fetch('/api/travar/'+id,{method:'DELETE'});if(r.ok){toast('Agenda destravada.');loadAgenda()}else toast('Não foi possível destravar.')}

function openPopulateAgenda(){openModal('Preencher agenda',`<p>Preencher a agenda com base no dia e horário preferenciais cadastrados nos pacientes ativos.</p><div class="formgrid"><label>Preencher agenda até<input id="populateUntil" type="date" value="${iso(addDays(new Date(),30))}"></label></div>`,`<button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="populateAgenda()">Preencher agenda</button>`)}

function initFinanceYears(){const sel=$('financeYear');if(!sel.options.length){const now=new Date().getFullYear();for(let y=now-3;y<=now+2;y++)sel.add(new Option(y,y));sel.value=now}}
async function loadFinanceForecast(){
  const d=await fetch('/api/financeiro/previsao?weeks=4').then(r=>r.json());
  const rows=d.periodos.map((x,i)=>`<div class="forecast-row"><div><b>Semana ${i+1}</b><small>${dmy(x.inicio)} a ${dmy(x.fim)}</small></div><span>${x.qtd} agend. · <strong>${money(x.valor)}</strong></span></div>`).join('');

async function loadFinance(){
  const mes=$('mesFin').value||iso(new Date()).slice(0,7);$('mesFin').value=mes;
  const d=await fetch('/api/financeiro/resumo?mes='+mes).then(r=>r.json());
  const cards=[
    ['💼','Atendimento',money(d.atendimento.valor),'atendimento'],
    ['📋','À Receber',money(d.devido.valor),'devido'],
    ['💰','Recebimentos',money(d.recebimentos.valor),'recebimentos'],
    ['⏰','Atrasados',money(d.atrasados.valor),'atrasados'],
    ['✅','Sessões realizadas',String(d.realizadas.qtd),'realizadas'],
    ['🚫','Faltas',`${d.faltas.qtd} · ${money(d.faltas.valor)}`,'faltas'],
    ['🔄','Com reagendamento',`${d.reagendadas.qtd} · ${money(d.reagendadas.valor)}`,'reagendadas']
  ];
  await loadFinanceForecast();
  $('financeCards').innerHTML=cards.map(c=>`<button class="kpi" onclick="openFinanceDetails('${c[3]}','${mes}')"><span class="finance-icon">${c[0]}</span><b>${c[1]}</b><strong>${c[2]}</strong></button>`).join('');
  await loadFinanceAnnual();
}

function dmyToIso(v){const s=String(v||'').trim();if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){const [d,m,y]=s.split('/');return `${y}-${m}-${d}`}if(/^\d{2}-\d{2}-\d{4}$/.test(s)){const [d,m,y]=s.split('-');return `${y}-${m}-${d}`}if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;return null}

function isBillableSession(x){return ['Realizada','Faltou'].includes(x.status)||(x.status==='Desmarcou'&&Number(x.billable_override||0)===1)}

async function loadFinanceAnnual(){
  initFinanceYears();const y=Number($('financeYear').value||new Date().getFullYear());
  const d=await fetch('/api/resumo-ano?ano='+y).then(r=>r.json());
  const rows=d.meses.map((x,i)=>`<tr><td>${MONTHS[i]}</td><td>${x.atendimento_qtd} · ${money(x.atendimento_valor)}</td><td>${money(x.recebimento)}</td><td>${x.faltas_qtd} · ${money(x.faltas_valor)}</td><td>${x.reag_qtd} · ${money(x.reag_valor)}</td></tr>`).join('');
  const maxA=Math.max(1,...d.meses.map(x=>x.atendimento_valor));
  const maxR=Math.max(1,...d.meses.map(x=>x.recebimento));
  const colsA=d.meses.map((x,i)=>`<button class="col-item chart-click" title="${MONTHS[i]}: ${money(x.atendimento_valor)}" onclick="openFinanceDetails('atendimento','${x.mes}')"><div class="col-value">${money(x.atendimento_valor)}</div><div class="col col-att" style="height:${Math.max(4,Math.round(x.atendimento_valor/maxA*150))}px"></div><span>${MONTHS[i].slice(0,3)}</span></button>`).join('');
  const colsR=d.meses.map((x,i)=>`<button class="col-item chart-click" title="${MONTHS[i]}: ${money(x.recebimento)}" onclick="openFinanceDetails('recebimentos','${x.mes}')"><div class="col-value">${money(x.recebimento)}</div><div class="col col-rec" style="height:${Math.max(4,Math.round(x.recebimento/maxR*150))}px"></div><span>${MONTHS[i].slice(0,3)}</span></button>`).join('');
  $('financeAnnual').innerHTML=`<div class="finance-charts"><div class="chart-card"><h3>Atendimento por mês</h3><div class="columns-chart">${colsA}</div></div><div class="chart-card"><h3>Recebimentos por mês</h3><div class="columns-chart">${colsR}</div></div></div><div class="chart-card" style="margin-bottom:10px"><h3>Resumo do ano</h3><div class="mini-stat"><span>Atendimentos</span><b>${d.totals.atendimento_qtd} · ${money(d.totals.atendimento_valor)}</b></div><div class="mini-stat"><span>Recebimentos</span><b>${money(d.totals.recebimento)}</b></div><div class="mini-stat"><span>Faltas</span><b>${d.totals.faltas_qtd} · ${money(d.totals.faltas_valor)}</b></div><div class="mini-stat"><span>Com reagendamento</span><b>${d.totals.reag_qtd} · ${money(d.totals.reag_valor)}</b></div></div></div><table class="finance-month-table"><thead><tr><th>Mês</th><th>Atendimento</th><th>Recebimentos</th><th>Faltas</th><th>Com reagendamento</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>Total ${y}</td><td>${d.totals.atendimento_qtd} · ${money(d.totals.atendimento_valor)}</td><td>${money(d.totals.recebimento)}</td><td>${d.totals.faltas_qtd} · ${money(d.totals.faltas_valor)}</td><td>${d.totals.reag_qtd} · ${money(d.totals.reag_valor)}</td></tr></tfoot></table>`;
}
async function openFinanceDetails(tipo,mes){
  const d=await fetch('/api/financeiro/detalhes?tipo='+encodeURIComponent(tipo)+'&mes='+mes).then(r=>r.json());
  const title={atendimento:'Atendimento',devido:'À Receber — sessões ainda não recebidas',recebimentos:'Recebimentos',atrasados:'Atrasados — mais de 30 dias',realizadas:'Sessões realizadas',faltas:'Faltas',reagendadas:'Cancelamentos com reagendamento'}[tipo]||'Detalhes';
  const grouped=d.slice().sort((a,b)=>((a.data||'').localeCompare(b.data||''))||((a.paciente_name||'').localeCompare(b.paciente_name||'')));
  const monthLabel=mes&&mes.length===7?`${MONTHS[Number(mes.slice(5))-1]} ${mes.slice(0,4)}`:mes;

  let body=grouped.length?`<table><thead><tr><th>Paciente</th><th>Data</th><th>Hora</th><th>Status</th><th>Valor</th><th>Observação</th></tr></thead><tbody>${grouped.map(x=>`<tr><td>${esc(x.paciente_name)}</td><td>${dmy(x.data)}</td><td>${esc(x.horario||'')}</td><td>${esc(x.status||'Pagamento')}</td><td>${money(x.valor)}</td><td>${esc(x.observacao||'')}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Nenhum registro para este período.</p>';
  openModal(`${title} • ${monthLabel}`,body,`<button class="secondary" onclick="closeModal()">Fechar</button>`);
}

  const sched=['dia_preferencial','horario_preferencial','frequencia','data_inicio_frequencia'].some(k=>String(old[k]||'')!==String(b[k]||''));if(sched)offerFill(id)}

async function savePatient(id){const old=id?await fetch('/api/pacientes/'+id).then(r=>r.json()).then(d=>d.paciente):null;const b={nome:$('pNome').value,telefone:$('pTel').value,observacoes:$('pNotes').value,valor_sessao:$('pFee').value,dia_preferencial:$('pDay').value,horario_preferencial:$('pTime').value,frequencia:$('pFrequency').value,data_inicio_frequencia:$('pStart').value||null};const changed=!!old&&(Number(old.weekday)!==Number(b.dia_preferencial)||String(old.habitual_time||'')!==String(b.horario_preferencial||'')||String(old.frequency||'Semanal')!==b.frequencia||String(old.frequency_start||'')!==String(b.data_inicio_frequencia||''));if(b.frequencia==='Quinzenal'&&!b.data_inicio_frequencia)return toast('Informe a data de referência para a frequência quinzenal.');const url=id?'/api/pacientes/'+id:'/api/pacientes';const r=await fetch(url,{method:id?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)return toast(j.error||'Erro');closeModal();toast(id?'Paciente atualizado.':'Paciente cadastrado.');loadPatients(true).then(()=>{if(!id&&j.id)selectPatient(j.id)});if(changed)offerFill(id)}

function monthKey(y,m){return y+'-'+String(m).padStart(2,'0')}
function addMonth(key,n){let [y,m]=key.split('-').map(Number);m+=n;while(m>12){y++;m-=12}while(m<1){y--;m+=12}return monthKey(y,m)}
function monthsBetween(from,to){const out=[];let k=from;while(k<=to){out.push(k);k=addMonth(k,1)}return out}
async function openPaymentControl(id){
  const d=await fetch('/api/pacientes/'+id).then(r=>r.json()), p=d.paciente;
  const from=loadPatientHistoryFrom()||d.sessoes.filter(x=>x.session_date<=iso(new Date())).map(x=>x.session_date).sort()[0]||iso(new Date());
  const today=iso(new Date()), start=from>today?today:from, end=today;
  const sessions=d.sessoes.filter(x=>x.session_date<=end).sort((a,b)=>(a.session_date+a.session_time).localeCompare(b.session_date+b.session_time));
  const payments=d.pagamentos.filter(x=>x.payment_date<=end).sort((a,b)=>a.payment_date.localeCompare(b.payment_date)||a.id-b.id);
  const first=start.slice(0,7), last=end.slice(0,7), months=monthsBetween(first,last);
  const openingDue=sessions.filter(x=>x.session_date<start&&isBillableSession(x)).reduce((a,x)=>a+Number(x.value||0),0);
  const openingPaid=payments.filter(x=>x.payment_date<start).reduce((a,x)=>a+Number(x.amount||0),0);
  let saldoAcumulado=Math.round((openingDue-openingPaid)*100)/100;
  const data=[];
  for(const m of months){
    const ss=sessions.filter(x=>x.session_date.slice(0,7)===m && x.session_date>=start);
    const pp=payments.filter(x=>x.payment_date.slice(0,7)===m && x.payment_date>=start);
    const due=ss.filter(isBillableSession).reduce((a,x)=>a+Number(x.value||0),0);
    const paid=pp.reduce((a,x)=>a+Number(x.amount||0),0);
    saldoAcumulado=Math.round((saldoAcumulado+due-paid)*100)/100;
    if(ss.length||pp.length||m===first)data.push({mes:m,sessoes:ss,pagamentos:pp});
  }
  paymentTextState={p,data,saldoFinal:saldoAcumulado,from:start};
  const text=buildPaymentText();
  openModal(`Controle de pagamentos • ${p.name}`,`<p class="muted">Extrato mensal desde <b>${dmy(start)}</b>. O texto abaixo pode ser personalizado antes do envio.</p><label style="display:block;font-size:11px;color:#555;margin-bottom:8px">Mensagem personalizada (opcional)<textarea id="waCustom" rows=3 style="width:100%" placeholder="Digite uma mensagem antes do extrato..."></textarea></label><label style="display:block;font-size:11px;color:#555">Texto para WhatsApp<textarea id="waText" rows=18 style="width:100%;font-family:Segoe UI,Arial,sans-serif;white-space:pre-wrap"></textarea></label>`,`<div class="wa-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="secondary" onclick="copyPaymentText()">📋 Copiar texto</button><button class="primary" onclick="copyPaymentTextAndOpenWhatsApp()">💬 Copiar e abrir WhatsApp</button></div>`);
  $('waText').value=text;
  $('waCustom').addEventListener('input',()=>{$('waText').value=buildPaymentText($('waCustom').value)});
}
function buildPaymentText(custom=''){
  const st=paymentTextState;if(!st)return '';
  let lines=[];if(custom.trim())lines.push(custom.trim(),'');
  for(const x of st.data){
    const month=MONTHS[Number(x.mes.slice(5))-1][0].toUpperCase()+MONTHS[Number(x.mes.slice(5))-1].slice(1);
    lines.push(`*${month} ${x.mes.slice(0,4)}*`);
    if(x.sessoes.length){
      for(const ss of x.sessoes){lines.push(`${dmy(ss.session_date)} – ${money(ss.value)}`);}
    }
    lines.push('*Pagamentos*');
    if(x.pagamentos.length){for(const pg of x.pagamentos)lines.push(`${dmy(pg.payment_date)} – ${money(pg.amount)}`);}else lines.push('Nenhum pagamento');
    if(x!==st.data[st.data.length-1]) lines.push('');
  }
  lines.push('');
  lines.push(`*Saldo à pagar: ${money(st.saldoFinal)}*`);
  return lines.join('\n').trim();
}

function formatBytes(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(1)+' KB';return (n/1024/1024).toFixed(1)+' MB'}

// A "Observação" é o status, como na planilha: faltou / sem antecedência (Faltou), desmarcou (Desmarcou),
// desmarquei / feriado... (Desmarquei). Sem palavra-chave, a observação é só um comentário da sessão.
const OBS_RULES=[[/desmarcou/,'Desmarcou'],[/d[e]s?marquei|feriad|congress|natal|ano novo|ferias|recesso/,'Desmarquei'],[/falt|sem anteced/,'Faltou'],[/realizad/,'Realizada']];
const obsNorm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function obsKeyword(text){const t=obsNorm(text);const r=OBS_RULES.find(([re])=>re.test(t));return r?r[1]:null}
function obsToStatus(text,current){return obsKeyword(text)||(['Faltou','Desmarcou','Desmarquei'].includes(current)?'Realizada':current)}
function obsLabel(x){const n=x.notes||'';if(x.status==='Realizada')return n;if(!n)return x.status;return (obsKeyword(n)===x.status||(x.status==='Agendada'&&/^agendad/.test(obsNorm(n))))?n:x.status+': '+n}
const OBS_SUGGESTIONS=['Faltou','Sem antecedência','Desmarcou','Desmarquei','Feriado'];

  const billed=x=>isBillableSession(x);
  const due=filteredS.filter(billed).reduce((a,x)=>a+Number(x.value||0),0),paid=filteredP.reduce((a,x)=>a+Number(x.amount||0),0);
  // O filtro altera os totais exibidos; o saldo é sempre o global do paciente (sessões passadas cobradas menos todos os pagamentos).
  const devidoGlobal=s.filter(x=>x.session_date<=todayIso&&billed(x)).reduce((a,x)=>a+Number(x.value||0),0);

    const v=Math.max(0,Number(x.value||0));if(credito+0.005>=v){quitadas.add(Number(x.id));credito=Math.max(0,Math.round((credito-v)*100)/100)}else credito=0}

  const q=patientRowData(p),quin=q.frequencia==='Quinzenal',open=ptFormOpen();
  const attach=`<details class="pt-card att"><summary>Arquivos anexados (${attachments.length})</summary><div class="patient-attachments-list" style="margin-top:8px">${attachments.length?attachments.map(a=>`<div class="patient-attachment-row"><span><a href="/api/anexos/${a.id}" target="_blank">📄 ${esc(a.filename)}</a> <span class="meta">(${formatBytes(a.size)})</span></span><button class="secondary" onclick="deletePatientAttachment(${a.id},${p.id})">Excluir</button></div>`).join(''):'<span class="muted">Nenhum arquivo anexado.</span>'}</div><div style="margin-top:8px"><button class="secondary" onclick="attachPatientFile(${p.id})">📎 Anexar arquivo</button></div></details>`;

  const sc=PT.rendered===id?[...document.querySelectorAll('#ptDetail .pt-scroll')].map(e=>e.scrollTop):[];

function renderImport(){const P=imp.plan,t=P.totais,box=document.querySelector('#modalRoot .modal'),top=box?box.scrollTop:0;
  const rows=P.pacientes.filter(p=>!imp.soMudancas||p.mudancas||!p.confere);
  const prob=P.problemas.length?`<h3>Linhas da planilha com problema (${P.problemas.length})</h3><p class="muted">A data está inválida ou com ano errado. Informe a data correta para importar a linha; deixando em branco ela não é importada (o saldo desse paciente ficará diferente do da planilha).</p><table class="imp-table"><thead><tr><th>Aba</th><th>Linha</th><th>Tipo</th><th>Data na planilha</th><th>Valor</th><th>Observação</th><th>Data correta</th></tr></thead><tbody>${P.problemas.map(x=>`<tr><td>${esc(x.aba)}</td><td>${x.linha}</td><td>${x.tipo==='pagamento'?'Pagamento':'Sessão'}</td><td>${esc(x.data||'')}</td><td>${money(x.valor)}</td><td>${esc(x.obs)}</td><td><input type="date" value="${esc(x.correcao)}" onchange="impFix('${esc(x.chave)}',this.value)"></td></tr>`).join('')}</tbody></table>`:'';
  const sem=P.semCorrespondencia.length?`<h3>Abas sem paciente correspondente no programa (${P.semCorrespondencia.length})</h3><p class="muted">Escolha o paciente do programa, crie um novo (abas ocultas entram como inativos) ou ignore. <button class="secondary" onclick="impAllNew()">Criar todos como novos</button></p><table class="imp-table"><thead><tr><th>Aba</th><th>Sessões</th><th>Pagamentos</th><th>Saldo</th><th>O que fazer</th></tr></thead><tbody>${P.semCorrespondencia.map(x=>`<tr><td>${esc(x.aba)}${x.oculta?' <span class="muted">(oculta)</span>':''}</td><td>${x.sessoes}</td><td>${x.pagamentos}</td><td>${money(x.saldo)}</td><td><select onchange="impMap('${esc(x.aba).replace(/'/g,"\\'")}',this.value)"><option value="">— ignorar —</option><option value="novo">➕ Criar paciente novo</option>${P.pacientesDoPrograma.map(q=>`<option value="${q.id}">${esc(q.nome)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>`:'';
  const pac=`<h3>Pacientes (${rows.length} de ${P.pacientes.length})</h3><label class="small"><input type="checkbox" ${imp.soMudancas?'checked':''} onchange="imp.soMudancas=this.checked;renderImport()"> mostrar só os que têm mudanças ou não conferem</label><table class="imp-table"><thead><tr><th>Paciente</th><th>Planilha<br>sessões · pagam.</th><th>Saldo na planilha</th><th>Saldo hoje no programa</th><th>Saldo depois</th><th>Mudanças</th><th></th></tr></thead><tbody>${rows.map((p,i)=>`<tr><td>${esc(p.nome)}${p.novo?' <span class="badge on">novo</span>':''}${p.aba.toLowerCase()!==p.nome.toLowerCase()?`<br><span class="muted">aba: ${esc(p.aba)}</span>`:''}</td><td>${p.sessoesPlanilha} · ${p.pagamentosPlanilha}</td><td>${money(p.saldoPlanilha)}</td><td>${money(p.saldoAntes)}</td><td>${money(p.saldoDepois)} <b title="${p.confere?'Confere com a planilha':'Diferente do saldo da planilha'}">${p.confere?'✅':'⚠️'}</b></td><td>${p.mudancas}</td><td><button class="secondary" onclick="impToggleDetail(${i})">detalhes</button></td></tr><tr id="impDet${i}" class="hidden"><td colspan="7">${impDetail(p)}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Nenhum paciente com mudanças.</td></tr>'}</tbody></table>`;
  const stat=(a,b)=>`<div class="mini-stat"><span>${a}</span><b>${b}</b></div>`;
  openModal('Importar planilha — prévia',`<p class="muted">${P.resumo.abas} abas de pacientes · ${P.resumo.sessoes} sessões cobradas (${money(P.resumo.valorSessoes)}) · ${P.resumo.pagamentos} pagamentos (${money(P.resumo.valorPagamentos)}) · comparação de ${dmy(P.janela.from)} a ${dmy(P.janela.to)}. Nada foi alterado ainda.</p>
  <div class="chart-card imp-stats">${stat('Sessões cobradas a incluir',t.sessoesIncluir+' · '+money(t.valorIncluir))}${stat('Valores de sessão a corrigir',t.sessoesCorrigir)}${stat('Sessões cobradas a remover/converter',t.sessoesRemover+' · '+money(t.valorRemover))}${stat('Pagamentos a incluir',t.pagIncluir+' · '+money(t.valorPagIncluir))}${stat('Pagamentos a corrigir',t.pagCorrigir)}${stat('Pagamentos a remover',t.pagRemover+' · '+money(t.valorPagRemover))}${stat('Histórico Desmarcou/Desmarquei a incluir',t.historicoIncluir)}</div>
  <div class="imp-opts"><label><input type="checkbox" ${imp.settings.removerExtras?'checked':''} onchange="impSet('removerExtras',this.checked)"> Remover do programa o que está cobrado/pago mas não está na planilha (a planilha é a referência)</label>
  <label>Linhas de valor zero <b>sem observação</b> (${P.zeroSemObservacao}): <select onchange="impSet('zeroSemObservacao',this.value)"><option value="nao" ${imp.settings.zeroSemObservacao==='nao'?'selected':''}>não importar</option><option value="Desmarcou" ${imp.settings.zeroSemObservacao==='Desmarcou'?'selected':''}>importar como Desmarcou</option><option value="Desmarquei" ${imp.settings.zeroSemObservacao==='Desmarquei'?'selected':''}>importar como Desmarquei</option></select></label></div>
  ${prob}${sem}${pac}`,`<button class="secondary" onclick="closeModal();imp=null">Cancelar</button><button class="primary" onclick="importApply()">Aplicar importação</button>`);
  const m=document.querySelector('#modalRoot .modal');m.classList.add('wide');m.scrollTop=top}
async function importApply(){const t=imp.plan.totais;
  if(!await confirmBox(`Aplicar a importação? Serão incluídas ${t.sessoesIncluir} sessões cobradas e ${t.pagIncluir} pagamentos, e removidas/convertidas ${t.sessoesRemover} sessões e ${t.pagRemover} pagamentos. Uma cópia de segurança do banco é feita antes.`,{title:'Aplicar importação',okText:'Aplicar'}))return;
  const r=await fetch('/api/importar/aplicar',{method:'POST',headers:{'Content-Type':'application/json'},body:impBody()});const j=await r.json().catch(()=>({}));
  if(!r.ok)return toast(j.error||'Não foi possível aplicar.');
  const ruins=j.conferencia.filter(c=>!c.confere);imp=null;
  openModal('Importação concluída',`<p>Cópia de segurança do banco: <b>${esc(j.backup)}</b> (na pasta <code>data\\backups</code>).</p><div class="chart-card imp-stats">${[['Sessões incluídas',j.sessoesIncluidas],['Valores corrigidos',j.sessoesCorrigidas],['Sessões convertidas',j.sessoesConvertidas],['Sessões removidas',j.sessoesRemovidas],['Histórico incluído',j.historicoIncluido],['Pagamentos incluídos',j.pagamentosIncluidos],['Pagamentos corrigidos',j.pagamentosCorrigidos],['Pagamentos removidos',j.pagamentosRemovidos],['Pacientes criados',j.pacientesCriados]].map(([a,b])=>`<div class="mini-stat"><span>${a}</span><b>${b}</b></div>`).join('')}</div>
  <p><b>Conferência de saldos:</b> ${j.conferencia.length-ruins.length} de ${j.conferencia.length} pacientes com o saldo igual ao da planilha.</p>${ruins.length?`<table class="imp-table"><thead><tr><th>Paciente</th><th>Saldo no programa</th><th>Saldo na planilha</th></tr></thead><tbody>${ruins.map(c=>`<tr><td>${esc(c.nome)}</td><td>${money(c.saldoPrograma)}</td><td>${money(c.saldoPlanilha)}</td></tr>`).join('')}</tbody></table><p class="muted">Diferenças costumam vir de linhas com problema não importadas ou de lançamentos anteriores à primeira data da planilha.</p>`:''}`,`<button class="primary" onclick="closeModal()">Fechar</button>`);
  loadFinance();loadPatients();loadAgenda()}
</script>
</body>
</html>
